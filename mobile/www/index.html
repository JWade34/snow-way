<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f172a">
<title>No signal | Snow Way</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .logo { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 16px; }
  .logo span { color: #22d3ee; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #94a3b8; font-size: 16px; line-height: 1.5; max-width: 22rem; margin: 0 auto 24px; }
  button { background: #22d3ee; color: #0f172a; font-weight: 700; font-size: 16px; border: 0; border-radius: 12px; padding: 14px 28px; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <div class="logo">SNOW<span>WAY</span></div>
    <h1>No signal right now</h1>
    <p>Snow Way needs a connection to load the latest forecasts. Try again when you're off the lift or back in range.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
