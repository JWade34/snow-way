# Dates are relative so the 7-day window always contains them.
vail_today:
  resort: vail
  forecast_date: <%= Date.current %>
  snowfall_inches: 0.5
vail_saturday:
  resort: vail
  forecast_date: <%= Date.current + 2 %>
  snowfall_inches: 6.0
vail_yesterday:
  resort: vail
  forecast_date: <%= Date.current - 1 %>
  snowfall_inches: 2.0
vail_beyond_window:
  resort: vail
  forecast_date: <%= Date.current + 7 %>
  snowfall_inches: 30.0
breck_today:
  resort: breckenridge
  forecast_date: <%= Date.current + 1 %>
  snowfall_inches: 9.0
alyeska_today:
  resort: alyeska
  forecast_date: <%= Date.current %>
  snowfall_inches: 0.0
