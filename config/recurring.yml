development:
  refresh_snow_forecasts:
    class: RefreshSnowForecastsJob
    queue: default
    schedule: every day at 6am

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  refresh_snow_forecasts:
    class: RefreshSnowForecastsJob
    queue: default
    schedule: every 6 hours
  search_stats_sync:
    class: SearchStatsSyncJob
    queue: default
    schedule: every day at 5am America/Denver
  site_change_evaluate:
    class: SiteChangeEvaluateJob
    queue: default
    schedule: every monday at 6am America/Denver
  ai_citation_check:
    class: AiCitationJob
    queue: default
    schedule: every sunday at 9pm America/Denver
  growth_weekly_email:
    command: "GrowthMailer.weekly.deliver_now"
    queue: default
    schedule: every monday at 7am America/Denver
  powder_report_snapshot:
    class: PowderReportSnapshotJob
    queue: default
    schedule: every thursday at 7am America/Denver
  social_plan:
    class: SocialPlanJob
    queue: default
    schedule: every day at 1am America/Denver
  social_publish:
    class: SocialPublishJob
    queue: default
    schedule: every 15 minutes
  weekly_snow_report:
    class: WeeklyReportJob
    queue: default
    schedule: every thursday at 7:30am America/Denver
  thursday_reddit_post_email:
    command: "GrowthMailer.thursday_post.deliver_now"
    queue: default
    schedule: every thursday at 7:15am America/Denver
