# Hand-reviewed SNOTEL station for each resort (USDA NRCS Snow Survey, free public data).
# Rules: same mountain or same drainage, near mid-mountain (not the village), 8+ of the last 10 winters of data.
# quality: good = on or next to the ski area; ok = same range/drainage within a few miles; weak = usable but
# a different slope or valley, shown only after Justin approves. Resorts not listed have no suitable station
# and are labeled as model estimates on the site.
# Reviewed 2026-11-09 from the NRCS station list (miles = straight line from the resort's map point).
