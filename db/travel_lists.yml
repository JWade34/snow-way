hot_springs_notes:
- text: The Colorado Historic Hot Springs Loop is a driving route of about 800 miles
    linking 23 hot springs facilities in 8 destinations, including Steamboat Springs,
    Glenwood Springs, Carbondale, Ouray, Durango, Pagosa Springs, Saguache County
    and Chaffee County.
  sources:
  - title: Colorado Historic Hot Springs Loop
    url: https://www.cohotspringsloop.com/
- text: Routt County requires 4WD vehicles with winter tires or chains on the road
    to Strawberry Park Hot Springs from November 1 to May 1. Shuttles from Steamboat
    run in winter, and a shuttle ticket counts as your entry.
  sources:
  - title: Strawberry Park Hot Springs
    url: https://www.strawberryhotsprings.com/
  - title: Strawberry Park shuttles
    url: https://strawberryhotsprings.com/shuttles/
- text: Pagosa Springs flooded in October 2025 when the San Juan River hit a 55-year
    peak. The Springs Resort was underwater but reopened within days. Healing Waters
    Resort's site still said it was temporarily closed for flood cleanup when checked
    on 2026-11-08.
  sources:
  - title: Hot spring resort seen underwater as flooded river hits 55-year peak (Denver
      Gazette)
    url: https://www.denvergazette.com/outtherecolorado/2025/10/14/hot-spring-resort-seen-underwater-as-flooded-river-hits-55-year-peak-in-colorado
  - title: Online rumors about damage harming Pagosa hot springs (CBS Colorado)
    url: https://www.cbsnews.com/colorado/news/online-rumors-damage-harming-pagosa-hot-springs-colorado
  - title: Healing Waters Resort hot springs page
    url: https://pshotsprings.com/hot-springs.html
