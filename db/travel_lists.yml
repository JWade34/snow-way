- slug: aspen
  name: Aspen
  state: Colorado
  resorts:
  - aspen-snowmass
  best_for: four ski mountains and a silver boom town
  why: 'Miners settled Aspen in 1879, and by 1891 it was the top silver mining district
    in the US. The Panic of 1893 crashed silver prices, and only 705 people lived
    there by 1930. Today four ski areas surround it: Aspen Mountain, Aspen Highlands,
    Buttermilk and Snowmass.'
  town_facts:
  - 'Elevation: just below 8,000 feet.'
  - 'Population: 7,004 (2020 census).'
  - Free buses within Aspen and Snowmass Village (RFTA).
  - Home to the Aspen Music Festival and School and the Aspen Institute.
  stay_place: Aspen, Colorado
  sources:
  - title: 'Wikipedia: Aspen, Colorado'
    url: https://en.wikipedia.org/wiki/Aspen,_Colorado
  - title: 'Wikipedia: Aspen/Pitkin County Airport'
