  - title: 'Wikipedia: Taos Regional Airport'
    url: https://en.wikipedia.org/wiki/Taos_Regional_Airport
- slug: santa-fe
  name: Santa Fe
  state: New Mexico
  best_for: adobe streets, farolitos and a ski hill near town
  why: Santa Fe was founded in 1610 and is the oldest state capital in the US. It
    is also the highest state capital. On Christmas Eve, thousands of farolitos (paper
    bags holding sand and a candle) line Canyon Road for a walk that began in the
    1970s.
  do:
  - 'Canyon Road Farolito Walk: Christmas Eve from about sunset. It is free and needs
    no reservation.'
  - 'Canyon Road galleries: the street is known for its many art and craft galleries.'
  - 'Santa Fe Plaza and the Palace of the Governors: the original seat of New Mexico''s
    government.'
  - 'Ski Santa Fe: about 16 miles from the city, with a base at 10,350 feet and 88
    trails.'
  when: December for the Christmas Eve farolito walk. Expect temperatures below freezing
    by evening.
  getting_there: SAF (Santa Fe Regional Airport), 10 miles southwest of the city center,
    with American Eagle and United Express flights.
  stay_place: Santa Fe, New Mexico
  resorts:
  - ski-santa-fe
  sources:
