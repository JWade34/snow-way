    url: https://en.wikipedia.org/wiki/Yampa_Valley_Regional_Airport
- slug: mount-rainier-in-winter
  name: Mount Rainier National Park in winter
  state: Washington
  best_for: snowshoeing in one of the snowiest places on Earth
  why: Paradise, on the south side of Mount Rainier, gets an average of 637 inches
    of snow a year. It once held the world record for snow in a single season, with
    1,122 inches in 1971-72. Rangers lead snowshoe walks there on winter weekends.
  do:
  - 'Ranger-led snowshoe walk: usually Saturdays and Sundays, late December through
    March, from the Jackson Visitor Center at 11 am. About 1.5 miles in 2 hours, limited
    to 25 people aged 8 and up.'
  - Cross-country ski or snowshoe on your own from Paradise.
  - 'Longmire: ski and snowboard information is available daily at the Longmire Museum.'
  when: Late December through March for ranger snowshoe walks.
  getting_there: SEA (Seattle-Tacoma). Ashford, outside the Nisqually Entrance, is
    85 miles from Sea-Tac. All vehicles must carry tire chains in winter, and the
    road from Longmire to Paradise closes every night.
  stay_place: Ashford, Washington
  resorts:
  - crystal-mountain
  sources:
