  - title: 'Wikipedia: Ketchum, Idaho'
    url: https://en.wikipedia.org/wiki/Ketchum,_Idaho
  - title: 'Wikipedia: Friedman Memorial Airport'
    url: https://en.wikipedia.org/wiki/Friedman_Memorial_Airport
- slug: fairbanks-northern-lights
  name: Fairbanks for the northern lights
  state: Alaska
  best_for: seeing the aurora borealis
  why: Fairbanks sits under the auroral oval, a ring-shaped zone over the far north
    where aurora activity is concentrated. Explore Fairbanks says the aurora is visible
    on an average of four out of five nights when the sky is clear and dark. Visitors
    who stay at least three nights and go out in the late evening can push their odds
    above 90 percent.
  do:
  - 'Aurora viewing: go out in the late evening, and stay three nights or more for
    the best odds.'
  - 'Dog sled ride: some tours combine mushing with aurora viewing.'
  - 'World Ice Art Championships: held in Fairbanks since 1991, from mid-February
    into March.'
  - 'Chena Hot Springs: 56.5 miles northeast of Fairbanks, with the year-round Aurora
    Ice Museum.'
  when: Aurora season runs August 21 to April 21. The ice art championships run from
    mid-February into March.
  getting_there: FAI (Fairbanks International Airport), three miles southwest of downtown.
  stay_place: Fairbanks, Alaska
  resorts: []
  sources:
  - title: 'Explore Fairbanks: Aurora season'
    url: https://www.explorefairbanks.com/explore-the-area/aurora-season/
  - title: 'Wikipedia: World Ice Art Championships'
    url: https://en.wikipedia.org/wiki/World_Ice_Art_Championships
  - title: 'Wikipedia: Chena Hot Springs'
    url: https://en.wikipedia.org/wiki/Chena_Hot_Springs
  - title: 'Wikipedia: Fairbanks International Airport'
    url: https://en.wikipedia.org/wiki/Fairbanks_International_Airport
- slug: taos
  name: Taos
  state: New Mexico
  best_for: high desert culture plus big mountain skiing
  why: Taos Pueblo, a UNESCO World Heritage Site, has been lived in for nearly a thousand
    years. The town grew into an art colony, and six painters formed the Taos Society
    of Artists in 1915. Taos Ski Valley sits 19 miles away, with a summit of 12,481
    feet.
  do:
  - 'Ski Taos Ski Valley: base at 9,200 feet, summit at 12,481 feet, founded by Ernie
    and Rhoda Blake in 1955.'
  - 'Taos Pueblo: a UNESCO World Heritage Site since 1992.'
  - 'Taos Plaza: the heart of the Taos Downtown Historic District.'
  - 'Rio Grande Gorge Bridge: carries US 64 over the gorge just west of town.'
  when: Ski season. No month-by-month source checked.
  getting_there: TSM (Taos Regional Airport), eight nautical miles northwest of town,
    with limited Contour and JSX flights. Santa Fe (SAF) is the next option.
  stay_place: Taos, New Mexico
  resorts:
  - taos-ski-valley
  sources:
