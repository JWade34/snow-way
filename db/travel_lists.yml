- slug: breckenridge
  name: Breckenridge
  state: Colorado
  resorts:
  - breckenridge
  best_for: a big historic district and winter festivals
  why: Breckenridge was founded in 1859 and named for prospector Thomas Breckenridge.
    Gold mining on the Blue River built the town, and the district yielded about one
    million troy ounces of gold. Its historic district has 249 structures and is one
    of the largest in Colorado.
  town_facts:
  - 'Elevation: about 9,600 feet.'
  - 'Population: 5,078 (2020 census).'
  - 249 structures in the historic district.
  - International Snow Sculpture Championships every January.
  stay_place: Breckenridge, Colorado
  sources:
  - title: 'Wikipedia: Breckenridge, Colorado'
    url: https://en.wikipedia.org/wiki/Breckenridge,_Colorado
  - title: 'GoBreck: Breckenridge Historic District'
    url: https://www.gobreck.com/experience-breckenridge/breckenridge-historic-district/
- slug: crested-butte
  name: Crested Butte
  state: Colorado
  resorts:
  - crested-butte
  best_for: a small, colorful old mining town
  why: Crested Butte grew up around coal and silver mines in the 1870s and was incorporated
    in 1880. When the coal mines closed, the town shrank. It now has about 1,600 people,
    and a free bus runs to the ski resort just up the road.
  town_facts:
  - 'Elevation: about 8,900 feet.'
  - 'Population: 1,639 (2020 census).'
  - Free town bus to the ski resort.
  - Named the Wildflower Capital of Colorado by the state legislature in 1990.
  stay_place: Crested Butte, Colorado
  sources:
  - title: 'Wikipedia: Crested Butte, Colorado'
    url: https://en.wikipedia.org/wiki/Crested_Butte,_Colorado
- slug: steamboat-springs
  name: Steamboat Springs
  state: Colorado
  resorts:
  - steamboat
  best_for: a working ranch town that breeds Olympians
  why: Steamboat Springs began as a ranching and mining town, and both still matter
    there. It has produced more Winter Olympians than any other town in North America.
    Howelsen Hill, right in town, is the oldest continually operating ski area in
    North America.
  town_facts:
  - 'Elevation: 6,867 feet.'
  - 'Population: 13,224 (2020 census).'
  - 'Howelsen Hill: oldest continually operating ski area in North America.'
  - Old Town Hot Springs is downtown.
  stay_place: Steamboat Springs, Colorado
  sources:
  - title: 'Wikipedia: Steamboat Springs, Colorado'
    url: https://en.wikipedia.org/wiki/Steamboat_Springs,_Colorado
  - title: 'Steamboat Chamber: Two Hot Springs, One Town'
    url: https://www.steamboatchamber.com/blog/post/hot-springs-in-colorado-soakers-guide-to-steamboat-springs/
- slug: park-city
  name: Park City
  state: Utah
  resorts:
  - park-city
  - deer-valley
  best_for: a Victorian main street near a big airport
  why: Park City was a silver town, and its Silver King Coalition mine was once the
    richest in the world. Sixty-four Victorian buildings on Main Street are on the
    National Register of Historic Places. The town co-hosted the 2002 Winter Olympics,
    with ski events at Deer Valley and Park City Mountain.
  town_facts:
  - 'Elevation: about 7,000 feet.'
  - 'Population: 8,396 (2020 census).'
  - 32 miles southeast of downtown Salt Lake City.
  - Free city bus system.
  stay_place: Park City, Utah
  sources:
  - title: 'Wikipedia: Park City, Utah'
    url: https://en.wikipedia.org/wiki/Park_City,_Utah
- slug: jackson
  name: Jackson
  state: Wyoming
  resorts:
  - jackson-hole
  - grand-targhee
  best_for: a western town square next to an elk refuge
  why: Jackson's Town Square has four arches made from more than 8,000 elk antlers,
    gathered from elk that winter on the National Elk Refuge at the edge of town.
    Snow King, Jackson's first ski area, rises above town. Jackson Hole Mountain Resort
    is 12 miles north.
  town_facts:
  - 'Elevation: 6,237 feet.'
  - 'Population: 10,760 (2020 census).'
  - Jackson Hole Airport is the only US commercial airport inside a national park.
  - Snow King Resort established in 1930.
  stay_place: Jackson, Wyoming
  sources:
  - title: 'Wikipedia: Jackson, Wyoming'
    url: https://en.wikipedia.org/wiki/Jackson,_Wyoming
  - title: 'Cowboy State Daily: Jackson''s Town Square arches'
    url: https://cowboystatedaily.com/2023/12/10/jackson-town-square-and-its-famous-arches-the-crown-jewel-of-wyoming-civic-parks-2
  - title: 'Wikipedia: Jackson Hole Airport'
    url: https://en.wikipedia.org/wiki/Jackson_Hole_Airport
- slug: ketchum-sun-valley
  name: Ketchum and Sun Valley
  state: Idaho
  resorts:
  - sun-valley
  best_for: a sheep and mining town turned into America's first destination ski resort
  why: Ketchum began as a smelting town for lead and silver, and by 1920 it was the
    largest sheep-shipping center in the West. In 1936 the Union Pacific Railroad
    opened Sun Valley next door, and the world's first chairlifts went in that fall.
    Ernest Hemingway lived near Ketchum and is buried there.
  town_facts:
  - 'Ketchum elevation: about 5,800 feet.'
  - 'Ketchum population: 3,555 (2020 census).'
  - Sun Valley Lodge opened December 21, 1936.
  - Bald Mountain has 13 chairlifts and 65 runs.
  stay_place: Ketchum, Idaho
  sources:
  - title: 'Wikipedia: Ketchum, Idaho'
    url: https://en.wikipedia.org/wiki/Ketchum,_Idaho
  - title: 'Wikipedia: Sun Valley, Idaho'
    url: https://en.wikipedia.org/wiki/Sun_Valley,_Idaho
- slug: stowe
  name: Stowe
  state: Vermont
  resorts:
  - stowe
  best_for: a white-steeple New England village
  why: Stowe was chartered in 1763 and has long called itself the Ski Capital of the
    East. Its village center is a 153-acre historic district with mostly 19th-century
    wood buildings, including the 1833 Green Mountain Inn. The ski resort is on Mount
    Mansfield, Vermont's highest peak.
  town_facts:
  - 'Population: 5,223 (2020 census).'
  - 'Mount Mansfield: 4,393 feet, highest in Vermont.'
  - Stowe Village Historic District listed in 1978.
  - 'Stowe Recreation Path: 5.3 miles.'
  stay_place: Stowe, Vermont
  sources:
  - title: 'Wikipedia: Stowe, Vermont'
    url: https://en.wikipedia.org/wiki/Stowe,_Vermont
  - title: 'Wikipedia: Stowe Village Historic District'
    url: https://en.wikipedia.org/wiki/Stowe_Village_Historic_District
  - title: 'Wikipedia: Mount Mansfield'
    url: https://en.wikipedia.org/wiki/Mount_Mansfield
- slug: taos
  name: Taos
  state: New Mexico
  resorts:
  - taos-ski-valley
  best_for: adobe history and an art colony
  why: Taos Pueblo, next to town, has been lived in for nearly a thousand years and
    is a UNESCO World Heritage Site. Artists began settling in Taos in 1899, and six
    of them formed the Taos Society of Artists in 1915. Taos Ski Valley is 19 miles
    away.
  town_facts:
  - 'Elevation: 6,969 feet.'
  - 'Population: 6,474 (2020 census).'
  - Taos Plaza is the center of the Taos Downtown Historic District.
  - 'Taos Ski Valley: summit at 12,481 feet.'
  stay_place: Taos, New Mexico
  sources:
  - title: 'Wikipedia: Taos, New Mexico'
    url: https://en.wikipedia.org/wiki/Taos,_New_Mexico
  - title: 'Wikipedia: Taos Ski Valley'
    url: https://en.wikipedia.org/wiki/Taos_Ski_Valley
- slug: whitefish
  name: Whitefish
  state: Montana
  resorts:
  - whitefish-mountain
  best_for: a railroad town near Glacier National Park
  why: Whitefish grew up after the Great Northern Railway moved its main line through
    in 1904. Its 1927-28 Tudor-style depot at the end of Central Avenue is on the
    National Register and now holds the town museum. Amtrak's Empire Builder still
    stops there, and Whitefish Mountain Resort is four miles from town.
  town_facts:
  - 'Elevation: 2,999 feet.'
  - 'Population: 7,751 (2020 census).'
  - Busiest Amtrak station in Montana.
  - Winter Carnival the first weekend in February.
  stay_place: Whitefish, Montana
  sources:
  - title: 'Wikipedia: Whitefish, Montana'
    url: https://en.wikipedia.org/wiki/Whitefish,_Montana
  - title: 'Wikipedia: Whitefish station'
    url: https://en.wikipedia.org/wiki/Whitefish_station
  - title: 'Wikipedia: Whitefish Mountain Resort'
    url: https://en.wikipedia.org/wiki/Whitefish_Mountain_Resort
- slug: truckee
  name: Truckee
  state: California
  resorts:
  - palisades-tahoe
  - northstar
  best_for: an old railroad town near Lake Tahoe
  why: Truckee grew as a railroad town when the Central Pacific reached it in 1868.
    Its downtown, the Commercial Row-Brickelltown Historic District, has 32 contributing
    buildings from 1870 to 1930. Amtrak's California Zephyr still stops daily at the
    historic depot.
  town_facts:
  - 'Elevation: 6,152 feet.'
  - 'Population: 16,729 (2020 census).'
  - Downtown historic district listed in 2009.
  - Donner Memorial State Park is at the east end of Donner Lake.
  stay_place: Truckee, California
  sources:
  - title: 'Wikipedia: Truckee, California'
    url: https://en.wikipedia.org/wiki/Truckee,_California
  - title: 'Wikipedia: Commercial Row-Brickelltown Historic District'
    url: https://en.wikipedia.org/wiki/Commercial_Row%E2%80%93Brickelltown_Historic_District
- slug: north-conway
  name: North Conway
  state: New Hampshire
  resorts:
  - cranmore
  best_for: a New England village with a ski hill in town
  why: North Conway sits in the Mount Washington Valley, with Mount Washington to
    the northwest. Its railroad reached town in 1872, and an 1874 Victorian depot
    still serves the Conway Scenic Railroad. Cranmore opened in the village in the
    winter of 1937-38, and Austrian ski pioneer Hannes Schneider came to teach there
    in 1939.
  town_facts:
  - 'Population: 2,116 (2020 census).'
  - 'Elevation: 581 feet.'
  - Cranmore opened in 1937-38 with a single rope tow.
  - Known for its many outlet shops.
  stay_place: North Conway, New Hampshire
  sources:
  - title: 'Wikipedia: North Conway, New Hampshire'
    url: https://en.wikipedia.org/wiki/North_Conway,_New_Hampshire
  - title: 'Wikipedia: Cranmore Mountain Resort'
    url: https://en.wikipedia.org/wiki/Cranmore_Mountain_Resort
- slug: lake-placid
  name: Lake Placid
  state: New York
  resorts:
  - whiteface
  best_for: a two-time Olympic village
  why: Lake Placid hosted the Winter Olympics in 1932 and 1980. Its main village sits
    beside Mirror Lake, which freezes for skating, pond hockey and a toboggan chute.
    Whiteface Mountain is about 13 miles away.
  town_facts:
  - 'Population: 2,205 (2020 census).'
  - 'Elevation: 1,801 feet.'
  - Mt. Van Hoevenberg Olympic Bobsled Run is on the National Register of Historic
    Places.
  - Site of the 1980 'Miracle on Ice' hockey game.
  stay_place: Lake Placid, New York
  sources:
  - title: 'Wikipedia: Lake Placid, New York'
    url: https://en.wikipedia.org/wiki/Lake_Placid,_New_York
  - title: 'Lake Placid tourism: Mirror Lake in winter'
    url: https://www.lakeplacid.com/ice-skating/mirror-lake-winter
- slug: mammoth-lakes
  name: Mammoth Lakes
  state: California
  resorts:
  - mammoth-mountain
  best_for: big snow and a long season in the Eastern Sierra
  why: A gold rush in 1878 brought about 1,500 people to Mammoth City, but by 1888
    fewer than 10 were left. The modern town was incorporated only in 1984. It sits
    below Mammoth Mountain, which gets about 400 inches of snow a year.
  town_facts:
  - 'Elevation: about 7,900 feet.'
  - 'Population: 7,191 (2020 census).'
  - 'Mammoth Mountain summit: 11,059 feet.'
  - Yosemite's east entrance is 32 miles north.
  stay_place: Mammoth Lakes, California
  note: This is the weakest pick for walkable main-street charm. Its history is a
    ghost town, not a surviving downtown. Consider listing it last or dropping it.
  sources:
  - title: 'Wikipedia: Mammoth Lakes, California'
    url: https://en.wikipedia.org/wiki/Mammoth_Lakes,_California
  - title: 'Wikipedia: Mammoth Mountain'
    url: https://en.wikipedia.org/wiki/Mammoth_Mountain
