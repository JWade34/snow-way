- slug: stowe
  name: Stowe
  state: Vermont
  best_for: a New England village with the state's highest peak
  why: Stowe has long called itself the Ski Capital of the East. Its ski resort is
    on Mount Mansfield, the highest mountain in Vermont at 4,393 feet. The Trapp family,
    of 'The Sound of Music', runs a 2,600-acre lodge in town with cross-country trails
    they began in the winter of 1968-69.
  do:
  - 'Ski Stowe Mountain Resort: on the east side of Mount Mansfield, one of the oldest
    ski areas in the US.'
  - 'Cross-country ski at Trapp Family Lodge: 67 km of groomed trails and 100 km ungroomed,
    as of 2008.'
  - 'Walk Stowe village: a 153-acre historic district that includes the 1833 Green
    Mountain Inn.'
  - 'Stowe Recreation Path: 5.3 miles from the village to TopNotch.'
  when: Ski season. No month-by-month source checked.
  getting_there: BTV (Burlington International Airport in South Burlington), by far
    the busiest airport in Vermont.
  stay_place: Stowe, Vermont
  resorts:
  - stowe
  - sugarbush
  sources:
