- slug: lake-tahoe
  name: Lake Tahoe
  state: California and Nevada
  best_for: skiing above a giant alpine lake
  why: Lake Tahoe is the largest alpine lake in North America and the second deepest
    lake in the US, at 1,645 feet. The state line splits it, with two-thirds in California
    and one-third in Nevada. Ski resorts ring the lake, and Olympic Valley hosted
    the 1960 Winter Olympics.
  do:
  - 'Ski Heavenly: it straddles the California and Nevada border, tops out at 10,067
    feet, and has a gondola from Heavenly Village.'
  - 'Ski Palisades Tahoe: in Olympic Valley, site of the 1960 Winter Olympics.'
  - 'Donner Memorial State Park: at the east end of Donner Lake near Truckee, where
    the Donner Party was snowbound in 1846.'
  when: Ski season. No month-by-month source checked.
  getting_there: RNO (Reno-Tahoe International Airport), three miles southeast of
    downtown Reno.
  stay_place: South Lake Tahoe, California
  alt_stay_place: Truckee, California
