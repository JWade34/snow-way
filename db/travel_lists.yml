- slug: telluride
  name: Telluride
  state: Colorado
  best_for: a mining town in a box canyon
  why: Telluride sits in a box canyon ringed by steep mountains, with Bridal Veil
    Falls at its head. Its historic district is one of Colorado's 20 National Historic
    Landmarks. A free gondola links the town to Mountain Village and the ski area
    in 13 minutes.
  do:
  - 'Ride the free gondola: 13 minutes from town to Mountain Village.'
  - 'Ski Telluride: the ski area rises from Mountain Village and the edge of town.'
  - 'Walk the historic district: Telluride was founded in 1878 after silver and gold
    strikes.'
  when: Ski season. No month-by-month source checked.
  getting_there: TEX (Telluride Regional Airport), six miles west of town at 9,078
    feet. It is the highest airfield in the US with scheduled passenger flights.
  stay_place: Telluride, Colorado
  resorts:
  - telluride
  sources:
