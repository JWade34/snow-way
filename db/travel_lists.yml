- slug: mammoth-lakes
  name: Mammoth Lakes
  state: California
  best_for: deep Sierra snow on a volcano
  why: Mammoth Mountain is a group of lava domes that formed between 110,000 and 57,000
    years ago on the edge of the Long Valley Caldera. It gets about 400 inches of
    snow a year. Its summit is at 11,059 feet, and a gondola is the easiest way to
    the top.
  do:
  - 'Ski Mammoth Mountain: about 400 inches of snow a year, summit 11,059 feet.'
  - 'Ride the summit gondola: the easiest way to the top, with views over the Long
    Valley Caldera.'
  - 'Mining history: a gold rush in 1878 brought about 1,500 people to Mammoth City.'
  when: Ski season. No month-by-month source checked.
  getting_there: BIH (Eastern Sierra Regional Airport, two miles east of Bishop),
    with United Express service to Denver and San Francisco.
  stay_place: Mammoth Lakes, California
  resorts:
  - mammoth-mountain
  sources:
