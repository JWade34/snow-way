- slug: breckenridge
  name: Breckenridge
  state: Colorado
  best_for: a gold rush town with winter festivals
  why: Breckenridge was founded in 1859 as a gold mining camp. Its historic district
    has 249 structures and is one of the largest in Colorado. Each winter the town
    hosts Ullr Fest in December and the International Snow Sculpture Championships
    in January.
  do:
  - 'International Snow Sculpture Championships: every January, sculptors carve 20-ton
    blocks of snow.'
  - 'Ullr Fest: a week of December events honoring the Norse god of snow.'
  - 'Walk the historic district: 249 historic structures in the old town east of the
    Blue River.'
  - 'Ski Breckenridge: the resort sits right above town.'
  when: December for Ullr Fest, January for the snow sculpture championships.
  getting_there: DEN (Denver International Airport), 23 to 25 miles from downtown
    Denver.
  stay_place: Breckenridge, Colorado
  resorts:
  - breckenridge
  - keystone
  - copper-mountain
