- slug: steamboat-springs
  name: Steamboat Springs
  state: Colorado
  best_for: hot springs and ranch town skiing
  why: Steamboat Springs is a ranching town named for a bubbling spring that sounded
    like a steamboat. It has produced more Winter Olympians than any other town in
    North America. Howelsen Hill, in town, is the oldest ski area in North America
    that has run without a break.
  do:
  - 'Old Town Hot Springs: heated outdoor pools fed by natural hot springs, right
    downtown.'
  - 'Strawberry Park Hot Springs: about a 20-minute drive from downtown. In winter,
    take the shuttle, and book ahead because reservations are required.'
  - 'Ski Howelsen Hill: the oldest continually operating ski area in North America.'
  - 'Winter Carnival: founded by Carl Howelsen, who brought ski jumping to town in
    1913.'
  when: Ski season. No month-by-month source checked.
  getting_there: HDN (Yampa Valley Regional Airport near Hayden), about 25 miles west
    of town. Most flights there are seasonal and run from December to April.
  stay_place: Steamboat Springs, Colorado
  resorts:
  - steamboat
  sources:
  - title: 'Wikipedia: Steamboat Springs, Colorado'
    url: https://en.wikipedia.org/wiki/Steamboat_Springs,_Colorado
