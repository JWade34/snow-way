winter_vacations:
- slug: yellowstone-in-winter
  name: Yellowstone National Park in winter
  state: Wyoming and Montana
  best_for: wildlife and geysers in the snow
  why: Most park roads close to cars in winter and open only to snowmobiles and snowcoaches
    from mid-December to mid-March. The road from the North Entrance at Gardiner to
    the Northeast Entrance stays open to cars all year, passing Mammoth Hot Springs
    and Lamar Valley. Two lodges stay open in winter, Old Faithful Snow Lodge and
    Mammoth Hot Springs Hotel.
  do:
  - 'Snowcoach or snowmobile tour: guided winter tours run to Old Faithful and other
    sites.'
  - 'Lamar Valley drive: the North to Northeast Entrance road stays open to cars all
    year.'
  - 'Old Faithful Snow Lodge: you can reach it in winter only by commercial snowcoach
    or snowmobile.'
  - 'Wildlife watching: expect bison on the roads, and stay 100 yards from bears,
    wolves and cougars and 25 yards from other animals.'
  when: Mid-December to mid-March. The 2025-26 winter season began December 15, 2025.
  getting_there: BZN (Bozeman). Yellowstone Airport (WYS) in West Yellowstone has
    commercial service only from June through September.
  stay_place: West Yellowstone, Montana
  alt_stay_place: Gardiner, Montana
  resorts:
  - big-sky
  sources:
  - title: 'NPS: Explore Yellowstone in Winter'
    url: https://www.nps.gov/yell/planyourvisit/visiting-yellowstone-in-winter.htm
  - title: 'NPS: Yellowstone winter season begins Dec. 15, 2025'
    url: https://www.nps.gov/yell/learn/news/25018.htm
  - title: 'NPS: Old Faithful Snow Lodge'
    url: https://www.nps.gov/places/000/old-faithful-snow-lodge.htm
  - title: 'Wikipedia: Yellowstone Airport'
    url: https://en.wikipedia.org/wiki/Yellowstone_Airport
  - title: 'Wikipedia: Bozeman Yellowstone International Airport'
    url: https://en.wikipedia.org/wiki/Bozeman_Yellowstone_International_Airport
- slug: jackson-hole-in-winter
  name: Jackson Hole
  state: Wyoming
  best_for: elk herds, steep skiing and a cowboy town square
  why: The National Elk Refuge borders the town of Jackson and holds an average of
    7,500 elk each winter. Horse-drawn sleigh rides take visitors out among the herd.
    Jackson Hole Mountain Resort is 12 miles north of town, and Snow King, the first
    ski area in Jackson, rises right above it.
  do:
  - 'Sleigh ride on the National Elk Refuge: run by the concessionaire Double H Bar.
    The 2025-26 season ran December 20 to April 4.'
  - 'Town Square: walk under four arches built from more than 8,000 elk antlers.'
  - 'Ski Jackson Hole Mountain Resort: 12 miles north of Jackson.'
  - 'Ski Snow King: established in 1930 as Jackson''s first ski area, at the edge
    of town.'
  when: 'Sleigh rides on the elk refuge run from late December to early April (2025-26
    season: December 20 to April 4).'
  getting_there: JAC (Jackson Hole Airport). It is seven miles north of Jackson and
    the only commercial airport in the US inside a national park.
  stay_place: Jackson, Wyoming
  resorts:
  - jackson-hole
  - grand-targhee
  sources:
  - title: 'Wikipedia: National Elk Refuge'
    url: https://en.wikipedia.org/wiki/National_Elk_Refuge
  - title: 'US Fish and Wildlife Service: Winter sleigh rides'
    url: https://www.fws.gov/locations/national-elk-refuge-refuge/winter-sleigh-rides
  - title: 'Jackson Hole Traveler: National Elk Refuge Sleigh Rides'
    url: https://www.jacksonholetraveler.com/?p=9407
  - title: 'Cowboy State Daily: Jackson''s Town Square has more than 8,000 elk antlers
      in its 4 arches'
    url: https://cowboystatedaily.com/2023/12/10/jackson-town-square-and-its-famous-arches-the-crown-jewel-of-wyoming-civic-parks-2
  - title: 'Wikipedia: Jackson, Wyoming'
    url: https://en.wikipedia.org/wiki/Jackson,_Wyoming
  - title: 'Wikipedia: Jackson Hole Airport'
    url: https://en.wikipedia.org/wiki/Jackson_Hole_Airport
- slug: lake-placid
  name: Lake Placid
  state: New York
  best_for: Olympic history and a frozen lake in the Adirondacks
  why: Lake Placid hosted the Winter Olympics twice, in 1932 and 1980. The 1980 Games
    brought the 'Miracle on Ice', when the US hockey team beat the Soviet Union 4
    to 3. Mirror Lake sits at the edge of the village and freezes over for skating,
    pond hockey and a toboggan chute.
  do:
  - 'Toboggan chute: a 30-foot converted ski jump trestle sends sleds 1,000 feet or
    more across frozen Mirror Lake. It needs at least 12 inches of ice, which may
    not come until early February.'
  - 'Skating on Mirror Lake: the ice is free and open to the public around the clock
    when conditions allow.'
  - 'Pond hockey: a tournament is held on Mirror Lake each February.'
  - 'Ski Whiteface: about 13 miles away in Wilmington.'
  when: The toboggan chute often opens around the first week of February, once Mirror
    Lake has 12 inches of ice.
  getting_there: SLK (Adirondack Regional Airport, near Saranac Lake). Cape Air flies
    there from Boston and New York JFK.
  stay_place: Lake Placid, New York
  resorts:
  - whiteface
  sources:
  - title: 'Wikipedia: Lake Placid, New York'
    url: https://en.wikipedia.org/wiki/Lake_Placid,_New_York
  - title: 'Lake Placid tourism: Sledding, tubing and tobogganing'
    url: https://www.lakeplacid.com/do/activities/sledding-tubing-tobogganing
  - title: 'Lake Placid tourism: Mirror Lake in winter'
    url: https://www.lakeplacid.com/ice-skating/mirror-lake-winter
  - title: 'Wikipedia: Adirondack Regional Airport'
    url: https://en.wikipedia.org/wiki/Adirondack_Regional_Airport
- slug: leavenworth
  name: Leavenworth
  state: Washington
  best_for: a Bavarian-style village under holiday lights
  why: Leavenworth was a struggling logging and railroad town until 1962, when a civic
    project began to remake it as a Bavarian village. Its Village of Lights festival
    runs on weekends from Thanksgiving to Christmas Eve, and the lights stay up through
    Valentine's Day. The Cascades around town offer Nordic trails, sledding, tubing
    and sleigh rides.
  do:
  - 'Village of Lights: the 2026 festival runs November 27 to December 24.'
  - 'Nordic skiing: groomed trails at Icicle River, the golf course, Leavenworth Ski
    Hill and Plain Valley.'
  - 'Leavenworth Ski Hill: tubing park, two rope tows, a historic lodge, and about
    7 km of Nordic track with 5 km lit for night skiing.'
  - 'Sledding: the Leavenworth Golf Course opens its slopes to sledders once there
    is enough snow.'
  - 'Sleigh rides: horse-drawn rides run from outfitters just outside town.'
  when: Late November through February. Festival dates are November 27 to December
    24, 2026, and the lights stay up through Valentine's Day.
  getting_there: EAT (Pangborn Memorial Airport, four miles east of Wenatchee), with
    Alaska Airlines service to Seattle. Drivers from the west cross Stevens Pass,
    which can require chains or traction tires in storms.
  stay_place: Leavenworth, Washington
  resorts:
  - stevens-pass
  sources:
  - title: 'Wikipedia: Leavenworth, Washington'
    url: https://en.wikipedia.org/wiki/Leavenworth,_Washington
  - title: 'Leavenworth tourism: Leavenworth in Winter, The Snow Guide'
    url: https://leavenworth.org/guides/leavenworth-in-winter/
  - title: 'Leavenworth tourism: Winter recreation'
    url: https://www.leavenworth.org/winter-recreation/
  - title: 'Wikipedia: Pangborn Memorial Airport'
    url: https://en.wikipedia.org/wiki/Pangborn_Memorial_Airport
- slug: sun-valley
  name: Sun Valley and Ketchum
  state: Idaho
  best_for: classic ski resort glamour and outdoor skating
  why: Union Pacific Railroad chairman W. Averell Harriman built Sun Valley, and its
    lodge opened on December 21, 1936. The world's first chairlifts were installed
    on its Proctor and Dollar mountains that same fall. The outdoor rink at Sun Valley
    Lodge is one of the few year-round outdoor ice rinks in the country.
  do:
  - 'Ski Bald Mountain: 13 chairlifts and 65 runs.'
  - 'Ice skating: the outdoor rink outside Sun Valley Lodge looks out at Bald Mountain,
    and skates are for rent.'
  - 'Walk Ketchum: by 1920 it was the largest sheep-shipping center in the West.'
  - 'Hemingway history: Ernest Hemingway lived near Ketchum and is buried in the Ketchum
    Cemetery.'
  when: Ski season. No month-by-month source checked.
  getting_there: SUN (Friedman Memorial Airport in Hailey), about 15 miles south of
    Ketchum. Delta, United, Alaska and American serve it, some routes seasonal.
  stay_place: Sun Valley, Idaho
  alt_stay_place: Ketchum, Idaho
  resorts:
  - sun-valley
  sources:
