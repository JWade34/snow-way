  events:
  - name: Stowe Winter Carnival
    when: Late January each year
    url: https://gostowe.com/signature_event/stowe-winter-carnival/
  non_skier_tip: Combine a sleigh ride and a trail pass at Trapp Family Lodge, then
    end the day at the von Trapp Bierhall on the same property.
