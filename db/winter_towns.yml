# Things to do in ski towns in winter (researched 2026-11-08). Every activity names a real business with its official link; prices as listed on the date shown.
---
lake-tahoe:
  name: Lake Tahoe
  state: California and Nevada
  resorts:
  - palisades-tahoe
  - northstar
  - heavenly
  intro: The Heavenly Gondola climbs 2.4 miles from Heavenly Village on the South
    Shore. On the North Shore, the Palisades Tahoe Aerial Tram climbs from 6,200 feet
    to High Camp at 8,200 feet, in the valley that hosted the 1960 Winter Games. Winter
    around the lake also means tubing hills, groomed cross-country trails, sleigh
    rides at Sand Harbor and snowmobile tours in Hope Valley.
  activities:
  - name: Snowmobiling at Zephyr Cove
    category: snowmobile
    what: Guided tours from Zephyr Cove Resort on the Nevada side. The 2-hour Scenic
      Lakeview Tour climbs through meadows to peaks near 9,000 feet.
    where: Zephyr Cove Resort
    price:
    url: https://www.zephyrcove.com/activities/winter/snowmobiling
    tour_query: snowmobile tour Lake Tahoe
  - name: Snowmobiling in Hope Valley
    category: snowmobile
    what: Guided tours start at 7,200 feet in Hope Valley, south of the lake in Alpine
      County. The Summit tour lasts 2 hours, and tours run from December 5, 2026 to
      April 30, 2027, weather permitting.
    where: Lake Tahoe Adventures
    price:
    url: https://www.laketahoeadventures.com/snowmobile-tours/snowmobile-tour-experience
    tour_query: snowmobile tour Hope Valley Lake Tahoe
  - name: Sleigh ride at Sand Harbor
    category: sleigh-ride
    what: A 55-minute horse-drawn ride from the Sand Harbor Visitor Center on the
      East Shore. When snow is low, the ride uses wheeled carriages.
    where: Borges Tahoe Sleigh and Carriage Rides, Lake Tahoe Nevada State Park
    price: "$60 adults, $30 children 2 to 16 ($75 and $40 on Saturdays and holidays),
      as listed on 2026-11-08"
    url: https://www.sleighride.com/
    tour_query: sleigh ride Lake Tahoe
  - name: Grover Hot Springs
    category: hot-springs
    what: A state park pool complex in an alpine meadow at about 5,900 feet, four
      miles west of Markleeville. The pools are open Friday through Monday, and tickets
      are sold at the park, first come, first served.
    where: Grover Hot Springs State Park
    price: Pool entry $10 adults, $5 children, plus $8 vehicle day use, as listed
      on 2026-11-08
    url: https://www.parks.ca.gov/?page_id=508
    tour_query:
  - name: Snow tubing at TubeTahoe
    category: tubing
    what: A tubing hill on Highway 50 in South Lake Tahoe with 1.5-hour sessions that
      include tube rental and parking. The 2026/27 season opens November 25, weather
      permitting.
    where: TubeTahoe
    price: From $65 per person (ages 13 and over, weekday), $75 on weekends, as listed
      on 2026-11-08
    url: https://www.tubetahoe.com/
    tour_query:
  - name: Tubing and sledding at Echo Summit
    category: tubing
    what: A family-owned snow play area at 7,400 feet on Echo Summit with groomed
      sledding runs and evening Tubing After Dark sessions.
    where: Adventure Mountain Lake Tahoe
    price: "$20 per vehicle resort entrance fee, as listed on 2026-11-08"
    url: https://www.adventuremountaintahoe.com/
    tour_query:
  - name: Cross-country skiing at Tahoe Donner
    category: nordic
    what: Over 100 km of cross-country ski and snowshoe trails near Truckee when fully
      open. A trail pass is required inside the area boundary.
    where: Tahoe Donner Cross Country
    price: Adult day pass from $43 when bought early, as listed on 2026-11-08
    url: https://www.tahoedonner.com/amenities/cross-country/
    tour_query:
  - name: Guided snowshoe tours
    category: snowshoe
    what: Guided snowshoe tours and group snowshoe trips run by a local guide service.
    where: Tahoe Adventure Company
    price:
    url: https://tahoeadventurecompany.com/ourtrips/winteradventures/
    tour_query: snowshoe tour Lake Tahoe
  - name: Ice skating in South Lake Tahoe
    category: ice-skating
    what: An indoor rink with public skate sessions. Every skater signs a waiver,
      and times can change for tournaments.
    where: South Lake Tahoe Ice Arena, 1176 Rufus Allen Blvd.
    price: "$16 with your own skates, $20 with rental, $10 under 10, as listed on
      2026-11-08"
    url: https://www.tahoeicearena.com/
    tour_query:
  - name: Heavenly Gondola
    category: scenic
    what: A 2.4-mile ride from Heavenly Village with an observation deck partway up.
      You do not need a ski ticket to ride, and the tubing park sits at the top. The
      tentative 2026-27 opening day is November 20.
    where: Heavenly Mountain Resort
    price:
    url: https://visitlaketahoe.com/tour/heavenly-gondola/
    tour_query:
  - name: Aerial Tram to High Camp
    category: scenic
    what: The tram climbs from The Village at 6,200 feet to High Camp at 8,200 feet.
      The Sierra Sightseeing Pass gives all-day rides, and High Camp has restaurants
      and a bar.
    where: Palisades Tahoe
    price:
    url: https://www.palisadestahoe.com/events-and-activities/activity-finder/aerial-tram
    tour_query:
  - name: Olympic Museum at High Camp
    category: museum
    what: Memorabilia from the 1960 Winter Games in Olympic Valley, historic Team
      USA uniforms and a short archival film. It is open when the Aerial Tram is running.
    where: Olympic Museum, High Camp, Palisades Tahoe
    price: Free with a scenic Aerial Tram ride, as listed on 2026-11-08
    url: https://www.palisadestahoe.com/events-and-activities/activity-finder/olympic-museum
    tour_query:
  free:
  - 'Emerald Bay: snowshoe down to Vikingsholm or into Desolation Wilderness from
    Eagle Falls Trailhead (no fee listed by Visit Lake Tahoe)'
  - 'Highway 89 flats: snowshoe at Pope, Kiva and Baldwin beaches and Taylor Creek
    Visitor Area (no fee listed)'
  - 'Rabe Meadow: easy, mostly flat snowshoeing on Kahle Drive near Stateline (no
    fee listed)'
  - 'After School Skate: free Wednesdays 2 to 3 pm at South Lake Tahoe Ice Arena for
    students and chaperones'
  - 'Olympic Museum: free once you are at High Camp on the Aerial Tram'
  events:
  - name: North Lake Tahoe SnowFest
    when: Late February into early March (2026 edition ran about Feb 25 to Mar 8);
      2027 dates not yet posted
    url: https://www.gotahoenorth.com/?p=92979
  - name: Ididarun Sled Dog Race at Tahoe Donner
    when: March (March 8 in 2026)
    url: https://www.tahoedonner.com/events/i-did-a-run
  non_skier_tip: Pair a Heavenly Gondola or Palisades Aerial Tram ride with a session
    at a tubing hill, since TubeTahoe and Adventure Mountain both sit on Highway 50
    near South Lake Tahoe.
  sources:
  - title: Zephyr Cove Resort snowmobiling
    url: https://www.zephyrcove.com/activities/winter/snowmobiling
  - title: Lake Tahoe Adventures snowmobile tours
    url: https://www.laketahoeadventures.com/snowmobile-tours/snowmobile-tour-experience
  - title: Borges Tahoe Sleigh and Carriage Rides
    url: https://www.sleighride.com/
  - title: 'Visit Lake Tahoe: Borges Family Sleigh and Carriage Rides'
    url: https://visitlaketahoe.com/winter-sports/borges-family-sleigh-and-carriage-rides/
  - title: 'California State Parks: Grover Hot Springs SP'
    url: https://www.parks.ca.gov/?page_id=508
  - title: TubeTahoe
    url: https://www.tubetahoe.com/
  - title: Adventure Mountain Lake Tahoe
    url: https://www.adventuremountaintahoe.com/
  - title: 'Visit Lake Tahoe: snow tubing in South Lake Tahoe'
    url: https://visitlaketahoe.com/sledding/6-amazing-places-to-go-snow-tubing-in-south-lake-tahoe/
  - title: Tahoe Donner Cross Country
    url: https://www.tahoedonner.com/amenities/cross-country/
  - title: Tahoe Donner day passes
    url: https://www.tahoedonner.com/amenities/amenities/cross-country/tickets-passes-rentals/day-passes/
  - title: Tahoe Adventure Company
    url: https://www.tahoeadventurecompany.com/
  - title: South Lake Tahoe Ice Arena
    url: https://www.tahoeicearena.com/
  - title: 'Visit Lake Tahoe: Heavenly Gondola'
    url: https://visitlaketahoe.com/tour/heavenly-gondola/
  - title: Palisades Tahoe Aerial Tram
    url: https://www.palisadestahoe.com/events-and-activities/activity-finder/aerial-tram
  - title: Palisades Tahoe Olympic Museum
    url: https://www.palisadestahoe.com/events-and-activities/activity-finder/olympic-museum
  - title: 'Visit Lake Tahoe: snowshoeing'
    url: https://visitlaketahoe.com/winter-sports/snowshoeing/
breckenridge:
  name: Breckenridge
  state: Colorado
  resorts:
  - breckenridge
  intro: Breckenridge is an old mining town with more than 200 shops on Main Street
    and a ski resort spread across several peaks above it. The free BreckConnect Gondola
    runs from town to Peak 7 and Peak 8, and two Nordic centers groom trails near
    town. Winter brings Ullr Fest in December and the International Snow Sculpture
    Championships in late January.
  activities:
  - name: Snowmobiling to the Continental Divide
    category: snowmobile
    what: Two-hour guided tours up the Swan River Valley toward Georgia Pass, reaching
      the Continental Divide at 11,585 feet. Each tour starts with practice time in
      an open meadow.
    where: Good Times Adventures, 6061 Tiger Road
    price: From $258 per snowmobile (solo driver), plus an $11 permit fee, as listed
      on 2026-11-08
    url: https://goodtimesadventures.com/snowmobiling.html
    tour_query: snowmobile tour Breckenridge
  - name: Dog sledding
    category: dog-sled
    what: A 90-minute tour covering six miles of Swan River Valley trails. Guests
      take turns mushing, riding in the sled and riding in a guide-driven sleigh.
    where: Good Times Adventures
    price: From $204 per person, plus a $7 permit fee, as listed on 2026-11-08
    url: https://goodtimesadventures.com/dogsledding.html
    tour_query: dog sledding Breckenridge
  - name: Sleigh rides
    category: sleigh-ride
    what: Scenic and dinner sleigh rides from the base of Peak 9 and from Gold Run
      Nordic Center. The Peak 9 dinner ride climbs from about 9,600 feet to about
      11,000 feet and stops at a yurt for a buffet with live entertainment.
    where: Breckenridge Stables
    price:
    url: https://breckstables.com/sleigh-rides
    tour_query: sleigh ride Breckenridge
  - name: Snow tubing in Frisco
    category: tubing
    what: A lift-served tubing hill in nearby Frisco with one-hour sessions. It opens
      for 2026/27 on November 26, weather permitting, and reservations are required.
    where: Frisco Adventure Park
    price: From $44 per hour ($55 on holiday dates), as listed on 2026-11-08
    url: https://www.townoffrisco.com/things-to-do/frisco-adventure-park/tubing/
    tour_query:
  - name: Cross-country skiing
    category: nordic
    what: More than 40 km of groomed classic and skate trails below the ski resort
      on Ski Hill Road, with lessons and rentals.
    where: Breckenridge Nordic Center
    price:
    url: https://www.breckenridgenordic.com/
    tour_query:
  - name: Snowshoeing and snowcat trips
    category: snowshoe
    what: Self-guided and guided snowshoe outings on the Nordic Center trails. The
      center also runs private snowcat trips to a backcountry hut with s'mores and
      hot chocolate.
    where: Breckenridge Nordic Center
    price:
    url: https://www.breckenridgenordic.com/
    tour_query: snowshoe tour Breckenridge
  - name: Ice skating
    category: ice-skating
    what: Public skating, drop-in hockey and learn-to-skate classes, with an indoor
      rink and a seasonal outdoor rink.
    where: Stephen C. West Ice Arena
    price:
    url: https://www.breckenridgerecreation.com/rates/locations/stephen-c-west-ice-arena/public-offerings
    tour_query:
  - name: BreckConnect Gondola
    category: scenic
    what: A free gondola from town to Peak 7 and Peak 8. No lift ticket is needed.
    where: Breckenridge Ski Resort
    price: Free, as listed on 2026-11-08
    url: https://www.gobreck.com/things-to-do/winter-activities/
    tour_query:
  - name: Barney Ford Museum
    category: museum
    what: A house museum run by the Breckenridge Heritage Alliance, one of several
      history sites in town along with the Edwin Carter Museum and the Welcome Center
      Museum.
    where: Barney Ford Museum, Breckenridge Heritage Alliance
    price: Free, $5 suggested donation, per the Breckenridge History listing on 2026-11-08
    url: https://breckhistory.org/historic-sites-and-museums/
    tour_query:
  - name: History walking and saloon tours
    category: other
    what: Guided tours of the historic district, including the Walk Through History
      Tour, the Saloon Tour and the Tombstone Tales Tour.
    where: Breckenridge Heritage Alliance
    price:
    url: https://breckhistory.org/historic-sites-and-museums/
    tour_query: walking tour Breckenridge
  - name: Distillery tour and tasting
    category: food-drink
    what: Tours of the production facility on Airport Road end with a bourbon tasting.
      Guests must be 21 or older to taste. A Main Street tasting room is open daily.
    where: Breckenridge Distillery, 1925 Airport Road
    price: Free 30-minute tour on Sundays; 45-minute reserved tour $25 per person,
      as listed on 2026-11-08
    url: https://breckenridgedistillery.com/tours/
    tour_query:
  free:
  - 'BreckConnect Gondola: ride from town to Peak 7 and Peak 8 with no lift ticket'
  - 'Breckenridge Distillery: complimentary 30-minute tour and bourbon tasting on
    Sundays'
  - 'Summit County Recpath: over 8 miles groomed for free skiing from the Breckenridge
    Rec Center to Frisco Adventure Park'
  - 'Golden Horseshoe: the town grooms Tom''s Baby and Middle Flume trails'
  - 'International Snow Sculpture Championships: free viewing at the Riverwalk Center,
    lit each evening until 10 pm'
  - 'Ullr Fest: the Ullr Parade down Main Street and the bonfire'
  events:
  - name: Lighting of Breckenridge and Race of the Santas
    when: First weekend of December
    url: https://gobreck.com/event/lighting-breckenridge-race-santas/
  - name: Ullr Fest
    when: December 17 to 19, 2026
    url: https://gobreck.com/event/ullr-fest/
  - name: New Year's Eve in Breckenridge
    when: December 31 (fireworks at the base of Peak 9 and a torchlight parade)
    url: https://gobreck.com/event/new-years-eve-in-breckenridge/
  - name: International Snow Sculpture Championships
    when: Sculpting January 23 to 27, 2027; viewing January 27 to February 2, 2027
    url: https://gobreck.com/event/international-snow-sculpture-championships/
  non_skier_tip: Book the Good Times dog sled and snowmobile tours early, and ride
    the free gondola up to Peak 8 for mountain views without a lift ticket.
  sources:
  - title: Good Times Adventures snowmobiling
    url: https://goodtimesadventures.com/snowmobiling.html
  - title: Good Times Adventures dog sledding
    url: https://goodtimesadventures.com/dogsledding.html
  - title: Breckenridge Stables sleigh rides
    url: https://breckstables.com/sleigh-rides
  - title: 'GoBreck: Breckenridge sleigh rides'
    url: https://gobreck.com/seasons/winter-spring/breckenridge-sleigh-rides/
  - title: Frisco Adventure Park tubing
    url: https://www.townoffrisco.com/things-to-do/frisco-adventure-park/tubing/
  - title: Breckenridge Nordic Center
    url: https://www.breckenridgenordic.com/
  - title: 'GoBreck: Nordic cross-country skiing'
    url: https://gobreck.com/go-breck/nordic-cross-country-skiing/
  - title: 'GoBreck: winter activities'
    url: https://www.gobreck.com/things-to-do/winter-activities/
  - title: 'Breckenridge History: historic sites and museums'
    url: https://breckhistory.org/historic-sites-and-museums/
  - title: Breckenridge Distillery tours
    url: https://breckenridgedistillery.com/tours/
  - title: 'GoBreck: best winter events'
    url: https://gobreck.com/winter-spring/best-winter-events-in-breckenridge/
  - title: 'GoBreck: Ullr Fest'
    url: https://gobreck.com/event/ullr-fest/
  - title: 'GoBreck: International Snow Sculpture Championships'
    url: https://gobreck.com/event/international-snow-sculpture-championships/
aspen:
  name: Aspen
  state: Colorado
  resorts:
  - aspen-snowmass
  intro: Aspen sits in the Roaring Fork Valley, with 90 km of free cross-country and
    snowshoe trails linking Aspen, Snowmass and Basalt. Non-skiers can ride the Silver
    Queen Gondola up Aspen Mountain, and the Aspen Art Museum downtown is free. X
    Games Aspen returns to Buttermilk on January 29 to 31, 2027.
  activities:
  - name: Snowmobiling to the Maroon Bells
    category: snowmobile
    what: A 2-hour guided tour from the ranch in the Maroon Creek valley to the base
      of the Maroon Bells. A longer Klondike Lunch Tour runs 2.5 to 3 hours.
    where: T-Lazy-7 Ranch, 3129 Maroon Creek Road
    price: From $325 per single rider (Maroon Bells Tour), as listed on 2026-11-08
    url:
    tour_query: snowmobile tour Aspen Maroon Bells
  - name: Sleigh ride to Pine Creek Cookhouse
    category: sleigh-ride
    what: Percheron draft horses pull a wooden sleigh 1.5 miles up the Castle Creek
      Valley near Ashcroft to lunch or a four-course dinner. Each way takes about
      20 minutes, and reservations are required.
    where: Pine Creek Cookhouse
    price: Sleigh ride and lunch from $145 per adult (regular rate), as listed on
      2026-11-08
    url: https://pinecreekcookhouse.com/winter-pricing/
    tour_query: sleigh ride Aspen
  - name: Guided snowshoe tour on Aspen Mountain
    category: snowshoe
    what: A 2-hour naturalist-led walk of about 1.5 miles from the top of the Silver
      Queen Gondola. The price covers the gondola ride, snowshoes and the guide, and
      tours run December 14 to April 16.
    where: Aspen Center for Environmental Studies (ACES)
    price: "$90 adults, $66 youth and seniors, as listed on 2026-11-08"
    url: https://aspennature.org/activity/aspen-mountain-snowshoe-tour/
    tour_query: snowshoe tour Aspen
  - name: Cross-country skiing on the valley trails
    category: nordic
    what: 90 km of free trails for cross-country skiing and snowshoeing between Aspen,
      Snowmass and Basalt, with lessons and rentals available.
    where: Aspen Snowmass Nordic Trail System (Aspen Nordic Council)
    price: Free, as listed on 2026-11-08
    url: https://www.aspennordic.com/
    tour_query:
  - name: Ice skating at Lewis Ice Arena
    category: ice-skating
    what: Public skate sessions at the Aspen Recreation Center. Skate rental is included
      with daily admission.
    where: Lewis Ice Arena, Aspen Recreation Center
    price: "$35 adults, $32 youth and seniors (daily admission), as listed on 2026-11-08"
    url: https://www.aspenrecreation.com/aspen-recreation-center/lewis-ice-arena
    tour_query:
  - name: Silver Queen Gondola sightseeing
    category: scenic
    what: A winter sightseeing ticket rides the Silver Queen Gondola to the top of
      Aspen Mountain or the Elk Camp Gondola at Snowmass. Rides run 9 am to 3:30 pm
      from November 26, 2026.
    where: Aspen Snowmass
    price: From $41, as listed on 2026-11-08
    url: https://www.aspensnowmass.com/visit/tickets-and-passes/sightseeing-and-tickets
    tour_query:
  - name: Aspen Art Museum
    category: museum
    what: A contemporary art museum downtown, open Tuesday to Sunday, 10 am to 6 pm.
    where: Aspen Art Museum, 637 East Hyman Avenue
    price: Free, as listed on 2026-11-08
    url: https://www.aspenartmuseum.org/
    tour_query:
  - name: Wheeler/Stallard Museum
    category: museum
    what: The Aspen Historical Society museum at 620 West Bleeker Street, currently
      showing the exhibition Aspen in Excess, the 1980s. The society also runs guided
      history tours.
    where: Aspen Historical Society
    price:
    url: https://aspenhistory.org/
    tour_query:
  - name: Glenwood Hot Springs Pool
    category: hot-springs
    what: A large hot springs pool down the valley in Glenwood Springs, with a hotter
      therapy pool and the Yampah Mineral Baths. It is open year-round, 9 am to 9
      pm.
    where: Glenwood Hot Springs Resort
    price:
    url: https://www.hotspringspool.com/
    tour_query:
  free:
  - 'Aspen Art Museum: free admission Tuesday to Sunday'
  - 'Aspen Snowmass Nordic Trail System: 90 km of free ski and snowshoe trails'
  - 'X Games Aspen: free to watch before 5 pm each day at Buttermilk'
  - 'Aspen Recreation Center: free sledding hill behind the building'
  events:
  - name: Wintersköl
    when: Mid-December (December 11 to 14 in 2025)
    url: https://www.aspenchamber.org/winterskol
  - name: X Games Aspen
    when: January 29 to 31, 2027, at Buttermilk
    url: https://www.aspensnowmass.com/visit/events/x-games-aspen
  non_skier_tip: Book the ACES snowshoe tour, which includes the Silver Queen Gondola
    ride, so you get the summit views and a guide for one price.
  sources:
  - title: T-Lazy-7 Ranch snowmobile tours
    url: https://www.tlazy7.com/snowmobile-tours
  - title: Pine Creek Cookhouse winter
    url: https://www.pinecreekcookhouse.com/winter
  - title: Pine Creek Cookhouse winter 2026-27 pricing
    url: https://pinecreekcookhouse.com/winter-pricing/
  - title: ACES Aspen Mountain snowshoe tour
    url: https://aspennature.org/activity/aspen-mountain-snowshoe-tour/
  - title: Aspen Nordic
    url: https://www.aspennordic.com/
  - title: 'Aspen Recreation Center: Lewis Ice Arena'
    url: https://www.aspenrecreation.com/aspen-recreation-center/lewis-ice-arena
  - title: Aspen Snowmass winter sightseeing tickets
    url: https://www.aspensnowmass.com/visit/tickets-and-passes/sightseeing-and-tickets
  - title: Aspen Art Museum
    url: https://www.aspenartmuseum.org/
  - title: Aspen Historical Society
    url: https://aspenhistory.org/
  - title: Glenwood Hot Springs Pool
    url: https://www.hotspringspool.com/
  - title: 'Aspen Chamber: winter for non-skiers'
    url: https://aspenchamber.org/blog/winter-non-skiers-aspen/
  - title: 'Aspen Snowmass: X Games Aspen'
    url: https://www.aspensnowmass.com/visit/events/x-games-aspen
jackson-hole:
  name: Jackson Hole
  state: Wyoming
  resorts:
  - jackson-hole
  intro: Jackson sits beside the National Elk Refuge, where horse-drawn sleighs carry
    visitors among wintering elk from December into April. Grand Teton National Park
    closes the Teton Park Road to cars from November 1 to April 30 and opens it to
    skiers and snowshoers. At Teton Village, the Aerial Tram rises 4,139 feet to Corbet's
    Cabin at 10,450 feet.
  activities:
  - name: Snowmobile tour to Granite Hot Springs
    category: snowmobile
    what: A guided snowmobile ride to Granite Hot Springs, where you can soak at the
      end of the trail. The company also runs a Greys River tour.
    where: Teton Tour Co.
    price:
    url: https://www.tetontourco.com/
    tour_query: snowmobile tour Jackson Hole Granite Hot Springs
  - name: Dog sledding to Granite Hot Springs
    category: dog-sled
    what: Half-day and full-day dog sled trips led by eight-time Iditarod veteran
      Frank Teasley. Only the full-day trip reaches Granite Hot Springs for a swim.
    where: Jackson Hole Iditarod Sled Dog Tours
    price:
    url: https://www.jhsleddog.com/trip-information
    tour_query: dog sledding Jackson Hole
  - name: Sleigh ride on the National Elk Refuge
    category: sleigh-ride
    what: A one-hour horse-drawn ride among wintering elk. Rides leave every 20 to
      30 minutes from the visitor center parking lot, and blankets are not provided.
    where: Double H Bar, departing the National Elk Refuge and Greater Yellowstone
      Visitor Center, 532 North Cache Street
    price: "$42 adults, $27 ages 5 to 12, as listed for the 2025-26 season on 2026-11-08"
    url: https://www.jacksonholechamber.com/outdoors/winter-activities/sleigh-rides/
    tour_query: National Elk Refuge sleigh ride
  - name: Granite Hot Springs
    category: hot-springs
    what: A developed hot springs pool in the Bridger-Teton National Forest. In winter
      it is reached only by snowmobile, dog sled, skis or fat bike, and the fee is
      cash only.
    where: Granite Hot Springs Pool, Bridger-Teton National Forest
    price: "$12 per person per day (ages 12 and up), $7 ages 11 and under, as listed
      on 2026-11-08"
    url: https://www.fs.usda.gov/r04/bridger-teton/recreation/granite-hot-springs-pool
    tour_query:
  - name: Snow tubing at Snow King
    category: tubing
    what: The King Tubes park at the base of Snow King Mountain in town has three
      groomed lanes side by side.
    where: Snow King Mountain Resort
    price:
    url: https://snowkingmountain.com/activities/king-tubes/
    tour_query:
  - name: Aerial Tram sightseeing
    category: scenic
    what: A 9-minute ride rising 4,139 feet to the summit of Rendezvous Peak, where
      Corbet's Cabin is known for its waffles.
    where: Jackson Hole Mountain Resort
    price: "$55 per person, as listed on 2026-11-08"
