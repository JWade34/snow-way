    url: https://en.wikipedia.org/wiki/Howelsen_Hill_Ski_Area
mammoth-lakes:
  name: Mammoth Lakes
  state: California
  resorts:
  - mammoth-mountain
  intro: Mammoth Lakes sits at about 7,880 feet in the Eastern Sierra and averages
    about 206 inches of snow a season. Winters are long and very snowy, with the heaviest
    snow from December through March. A free bus system links town, The Village and
    the ski lodges.
  activities:
  - name: Mammoth Mountain Snowmobile Adventures
    category: snowmobile
    what: Guided 90-minute tours on more than 100 miles of trails and meadows, run
      daily from December 11, 2026 to April 4, 2027. Drivers must be 16 with a license.
    where: Snowmobile Adventures, 10200 Minaret Rd, next to Main Lodge
    price:
    url: https://www.mammothmountain.com/things-to-do/activities/snowmobile
    tour_query: snowmobile tour Mammoth Lakes
  - name: DJ's Snowmobile Adventures
    category: snowmobile
    what: Backcountry tours, self-guided tours and SnowPark riding on more than 95
      square miles of trails. Opening day is December 19, 2026, weather permitting.
    where: DJ's Snowmobile Adventures, near Mammoth Lakes
    price:
    url: https://www.snowmobilemammoth.com/
    tour_query: snowmobile tour Mammoth Lakes
  - name: Tubing at Woolly's Adventure Summit
    category: tubing
    what: Two 512-foot tubing runs with a conveyor lift and speeds up to 28 mph. Riders
      must be 42 inches or taller. Open daily December 11, 2026 to April 11, 2027.
    where: Woolly's Adventure Summit, 9000 Minaret Road
    price:
    url: https://www.mammothmountain.com/things-to-do/woollys-adventure-summit
    tour_query:
  - name: Mountain Coaster and Zip Line at Woolly's
    category: other
    what: A mountain coaster and a winter zip line run alongside the tubing hill.
      Solo coaster riders must be 54 inches or taller and zip liners must be 7 or
      older.
    where: Woolly's Adventure Summit
    price:
    url: https://www.mammothmountain.com/things-to-do/woollys-adventure-summit
    tour_query:
  - name: Scenic Gondola to the summit
    category: scenic
    what: A 7-minute ride to the 11,053-foot summit, with a cafe and summit sign at
      the top. Kids 12 and under ride free with a paying adult (up to two).
    where: Mammoth Mountain Scenic Gondola
    price:
    url: https://www.mammothmountain.com/things-to-do/activities/scenic-gondola
    tour_query:
  - name: Eleven53 Interpretive Center
    category: museum
    what: Hands-on exhibits and a docent at the summit. Entry is included with a gondola
      ticket.
    where: Summit of Mammoth Mountain
    price:
    url: https://www.mammothmountain.com/things-to-do/activities/scenic-gondola
    tour_query:
  - name: Tamarack Cross-Country Ski Center
    category: nordic
    what: More than 19 miles (30 km) of groomed ski and snowshoe trails in the Lakes
      Basin. Scheduled to run daily November 16, 2026 to April 16, 2027.
    where: Tamarack Lodge, 163 Twin Lakes Rd.
    price:
    url: https://www.mammothmountain.com/things-to-do/activities/tamarack-cross-country-ski-center
    tour_query:
  - name: Tamarack sunset and full moon snowshoe tours
    category: snowshoe
    what: Guided snowshoe tours at sunset and under the full moon, with rentals at
      the Tamarack yurt.
    where: Tamarack Cross-Country Ski Center
    price:
    url: https://www.mammothmountain.com/things-to-do/events/tamarack-full-moon-snowshoe-tours
    tour_query: snowshoe tour Mammoth Lakes
  - name: LA Kings Ice at Mammoth Lakes
    category: ice-skating
    what: An indoor Olympic-size rink with daily open skate from October through mid-April.
      Skates and helmets are for rent.
    where: Community Recreation Center, 686 Old Mammoth Road
    price:
    url: https://www.lakingsicemammothlakes.com/
    tour_query:
  - name: Mammoth Brewing Co.
    category: food-drink
    what: A taproom brewing since 1995, with food from The EATery inside. Open daily
      from 10 am.
    where: Mammoth Brewing Co., 18 Lake Mary Road
    price:
    url: https://www.mammothbrewingco.com/
    tour_query:
  free:
  - 'Free Red Line shuttle: runs every 20 minutes between The Village, Woolly''s and
    Main Lodge.'
  - 'Tamarack Public Access Trail: a free trail along Lake Mary Road.'
  - 'Tamarack naturalist tours: free guided nature tours on snowshoes.'
  - 'Scenic Gondola for kids: ages 12 and under ride free with a paying adult, and
    adults 80 and over ride free.'
  - 'Holiday Tree Lighting in The Village: November 27, 2026, 6 to 8:30 pm.'
  events:
  - name: Holiday Tree Lighting in The Village
    when: November 27, 2026
    url: https://www.mammothmountain.com/things-to-do/events/holiday-tree-lighting
  - name: Kids Ski Free Week
    when: December 5 to 11, 2026
    url: https://www.mammothmountain.com/plan-your-trip/deals-and-packages/kids-ski-free-week
  non_skier_tip: Park at The Village and take the free Red Line shuttle to Woolly's
    and Main Lodge, since parking at both is limited.
  sources:
  - title: 'Mammoth Mountain: Winter activities'
    url: https://www.mammothmountain.com/things-to-do/winter-activities
  - title: 'Mammoth Mountain: Snowmobile'
    url: https://www.mammothmountain.com/things-to-do/activities/snowmobile
  - title: 'Mammoth Mountain: Woolly''s Adventure Summit'
    url: https://www.mammothmountain.com/things-to-do/woollys-adventure-summit
  - title: 'Mammoth Mountain: Scenic Gondola'
    url: https://www.mammothmountain.com/things-to-do/activities/scenic-gondola
  - title: 'Mammoth Mountain: Tamarack Cross-Country Ski Center'
    url: https://www.mammothmountain.com/things-to-do/activities/tamarack-cross-country-ski-center
  - title: 'Mammoth Mountain: Events'
    url: https://www.mammothmountain.com/things-to-do/events
  - title: 'Visit Mammoth: Ice skating'
    url: https://www.visitmammoth.com/things-to-do/winter-activities/ice-skating-mammoth-lakes/
  - title: DJ's Snowmobile Adventures
    url: https://www.snowmobilemammoth.com/
  - title: 'Wikipedia: Mammoth Lakes, California'
    url: https://en.wikipedia.org/wiki/Mammoth_Lakes,_California
whistler:
  name: Whistler
  state: British Columbia
  resorts:
  - whistler-blackcomb
  intro: Whistler is a resort town about 125 km north of Vancouver with its village
    at the base of Whistler and Blackcomb mountains. It was the Host Mountain Resort
    for the 2010 Winter Olympics, and its Olympic venues are open to visitors. All
    prices below are in Canadian dollars (CAD).
  activities:
  - name: Blackcomb Snowmobile tours
    category: snowmobile
    what: Family-owned since 1992, with 2 and 3 hour wilderness, family and private
      tours. On family tours, kids 5 to 12 ride free with a paying adult.
    where: Blackcomb Snowmobile, 4293 Mountain Square
    price: From CAD $239 per person sharing, or CAD $279 single driver (2-hour tour),
      as listed on 2026-11-08
    url: https://www.blackcombsnowmobile.com/
    tour_query: snowmobile tour Whistler
  - name: Trapper's Run dog sledding
    category: dog-sled
    what: A 3-hour round trip, including shuttle, through old-growth forest in the
      Callaghan Valley. Departures are at 8 am and 11 am.
    where: Canadian Wilderness Adventures, Callaghan Valley
    price: From CAD $799 per sled for 1 or 2 people (higher in peak season), as listed
      on 2026-11-08
    url: https://www.canadianwilderness.com/whistler/dog-sledding/
    tour_query: dog sledding Whistler
  - name: Blackcomb Snowmobile Holiday Sleigh Ride
    category: sleigh-ride
    what: A 2-hour round trip from Whistler Village by sleigh. It needs at least 6
      people to run.
    where: Blackcomb Snowmobile
    price: CAD $199 per adult, CAD $149 per child 3 to 12, as listed on 2026-11-08
    url: https://www.blackcombsnowmobile.com/holiday-sleigh-ride/
    tour_query: sleigh ride Whistler
  - name: Scandinave Spa Whistler
    category: other
    what: An outdoor Nordic spa in the forest with hot pools, cold plunges, saunas
      and rest areas. The spa is silent and open daily 9 am to 10 pm.
    where: Scandinave Spa, 8010 Mons Rd
    price: From CAD $138 for the Thermal Journey (Mon to Thu, regular season, plus
      tax), as listed on 2026-11-08
    url: https://www.scandinave.com/en/whistler/rates/
    tour_query:
  - name: Whistler Olympic Plaza skating rink
    category: ice-skating
    what: An outdoor rink in the village run by the municipality. It reopens November
      26, 2026, weather permitting.
    where: Whistler Olympic Plaza
    price: CAD $6.25 per adult, CAD $3.75 ages 4 to 12, skate rental CAD $7.25, as
      listed on 2026-11-08
    url: https://www.whistler.ca/skating
    tour_query:
  - name: bubly Tube Park
    category: tubing
    what: More than 1,000 feet of tubing lanes with a conveyor lift back to the top.
      Reach it from the village on the Excalibur Gondola, no lift ticket needed.
    where: Base 2, Blackcomb Mountain
    price:
    url: https://www.whistler.com/activities/tube-park/
    tour_query:
  - name: Whistler Olympic Park
    category: nordic
    what: The 2010 Nordic venue in the Callaghan Valley, with cross-country and snowshoe
      trails including more than 12 km of dog-friendly trails. Winter opens November
      27, with night skiing Mondays and Wednesdays from December 14, 2026.
    where: Whistler Olympic Park, 1500 Callaghan Valley Rd
    price:
    url: https://www.whistlerolympicpark.com/
    tour_query:
  - name: Whistler Sliding Centre
    category: other
    what: The 2010 Olympic sliding track, where visitors can try passenger bobsleigh
      with a pro pilot or public skeleton. No experience is needed.
    where: Whistler Sliding Centre
    price:
    url: https://www.whistlerslidingcentre.com/
    tour_query:
  - name: PEAK 2 PEAK Gondola
    category: scenic
    what: A 4.4 km gondola between Whistler and Blackcomb, 436 m above the valley
      at its highest point. The ride takes about 11 minutes.
    where: Whistler Blackcomb
    price:
    url: https://www.whistlerblackcomb.com/explore-the-resort/activities/winter-activities/peak-2-peak-gondola.aspx
    tour_query:
  - name: Audain Art Museum
    category: museum
    what: A collection of British Columbia art, including works by Emily Carr. Open
      Thursday to Monday, 11 am to 6 pm.
    where: Audain Art Museum, 4350 Blackcomb Way
    price: CAD $22 per adult, free for ages 18 and under, as listed on 2026-11-08
    url: https://www.audainartmuseum.com/tickets/
    tour_query:
  - name: Squamish Lil'wat Cultural Centre
    category: museum
    what: A cultural centre of the Squamish and Lil'wat Nations, with hourly guided
      tours and a cafe. Open Wednesday to Sunday, 10 am to 5 pm.
    where: Squamish Lil'wat Cultural Centre, 4584 Blackcomb Way
    price: CAD $25 per adult, CAD $12 ages 6 to 18 (CAD $20 / $10 from November 6
      to December 16, 2026), plus GST, as listed on 2026-11-08
    url: https://www.slcc.ca/visit
    tour_query:
  - name: Whistler Brewing Company
    category: food-drink
    what: A local brewery with a taphouse. Guided tours with tastings run all year.
    where: Whistler Brewing Company, 1045 Millar Creek Rd
    price:
    url: https://www.whistlerbeer.com/
    tour_query:
  free:
  - 'Olympic Plaza rink for toddlers: free skating for ages 3 and under, with free
    helmets and skate aids.'
  - 'Audain Art Museum for youth: free admission for ages 18 and under.'
  - 'World Ski & Snowboard Festival: free outdoor concerts in the village each April.'
  events:
  - name: Whistler Pride
    when: January 24 to 30, 2027
    url: https://www.whistler.com/events/winterpride/
  - name: World Ski & Snowboard Festival
    when: April 2027 (2026 run was April 6 to 12)
    url: https://wssf.com
  non_skier_tip: Pair a morning dog sled or snowmobile tour with an afternoon at Scandinave
    Spa, and book the spa on a Monday to Thursday for the lower rate.
  sources:
  - title: Blackcomb Snowmobile
    url: https://www.blackcombsnowmobile.com/
  - title: 'Blackcomb Snowmobile: Holiday Sleigh Ride'
    url: https://www.blackcombsnowmobile.com/holiday-sleigh-ride/
  - title: 'Canadian Wilderness Adventures: Dog sledding'
    url: https://www.canadianwilderness.com/whistler/dog-sledding/
  - title: Scandinave Spa Whistler rates
    url: https://www.scandinave.com/en/whistler/rates/
  - title: 'Resort Municipality of Whistler: Skating'
    url: https://www.whistler.ca/skating
  - title: Whistler Olympic Park
    url: https://www.whistlerolympicpark.com/
  - title: Whistler Sliding Centre
    url: https://www.whistlerslidingcentre.com/
  - title: Audain Art Museum tickets
    url: https://www.audainartmuseum.com/tickets/
  - title: 'Squamish Lil''wat Cultural Centre: Visit'
    url: https://www.slcc.ca/visit
  - title: 'Wikipedia: Peak 2 Peak Gondola'
    url: https://en.wikipedia.org/wiki/Peak_2_Peak_Gondola
  - title: 'Wikipedia: Whistler, British Columbia'
    url: https://en.wikipedia.org/wiki/Whistler,_British_Columbia
stowe:
  name: Stowe
  state: Vermont
  resorts:
  - stowe
  intro: Stowe is a New England village of about 5,200 people at the foot of Mount
    Mansfield, the highest peak in Vermont. It calls itself the Ski Capital of the
    East and held its first Winter Carnival in 1921. The Trapp Family Lodge, home
    of the family from The Sound of Music, runs a large cross-country center in the
    hills above town.
  activities:
  - name: Sleigh rides at Trapp Family Lodge
    category: sleigh-ride
    what: Horse-drawn sleigh rides with a guide through the lodge's fields, with views
      of the Green Mountains. Rides run Wednesdays, Saturdays and Sundays in winter.
    where: Trapp Family Lodge (von Trapp Family Lodge & Resort)
    price:
    url: https://www.vontrappresort.com/winter.htm
    tour_query: sleigh ride Stowe Vermont
  - name: Trapp Family Lodge Outdoor Center
    category: nordic
    what: Cross-country skiing and snowshoeing on the lodge's trail network, including
      a 3-mile trip to Slayton Pasture Cabin. The center is open daily 9 am to 5 pm
      in season.
    where: Trapp Family Lodge Outdoor Center
    price: From $32 per adult weekday trail pass (one section of the same page lists
      $33), as listed on 2026-11-08
    url: https://www.vontrappresort.com/winter.htm
    tour_query:
  - name: Snowmobile Vermont
    category: snowmobile
    what: Guided two-hour backcountry snowmobile tours in Stowe.
    where: Snowmobile Vermont, Stowe
    price:
    url: https://www.snowmobilevermont.com/
    tour_query: snowmobile tour Stowe Vermont
  - name: Eden Dogsledding
    category: dog-sled
    what: Winter dog sledding on natural snow from December to April at a sled dog
      sanctuary. Advance reservations are required.
    where: Eden Dogsledding, Eden, Vermont (about 45 minutes north of Stowe)
    price:
    url: https://www.edendogsledding.com/
    tour_query: dog sledding Vermont
  - name: Umiak Outdoor Outfitters tours
    category: snowshoe
    what: Guided snowshoe, ski, sledding and dog sled tours, plus winter equipment
      rentals.
    where: Umiak Outdoor Outfitters
    price:
    url: https://www.umiak.com/
    tour_query: snowshoe tour Stowe Vermont
  - name: Stowe Arena
    category: ice-skating
    what: The town's indoor rink, with public skate sessions for all ages. The pro
      shop rents and sharpens skates.
    where: Stowe Arena, 350 Park St
    price:
    url: https://www.stowevt.gov/Departments/Parks-Recreation/Stowe-Arena
    tour_query:
  - name: Vermont Ski and Snowboard Museum
    category: museum
    what: A museum of Vermont ski and snowboard history in the village center. Open
      afternoons from 12 to 5 pm, Wednesday or Thursday through Sunday, and closed
      October 26 to November 26.
    where: Vermont Ski and Snowboard Museum, 1 South Main Street
    price:
    url: https://www.vtssm.org/
    tour_query:
  - name: The Alchemist Brewery
    category: food-drink
    what: A Stowe brewery with a beer cafe, retail shop, daily tours and a food truck
      Thursday to Sunday.
    where: The Alchemist, 100 Cottage Club Road
    price:
    url: https://alchemistbeer.com/
    tour_query:
  - name: von Trapp Bierhall
    category: food-drink
    what: The von Trapp brewery's beer hall and gift shop, open daily 11:30 am to
      9 pm.
    where: von Trapp Brewing, 1333 Luce Hill Road
    price:
    url: https://www.vontrappbrewing.com/
    tour_query:
  - name: Cold Hollow Cider Mill
    category: food-drink
    what: Watch cider being pressed and try the cider donuts made fresh daily. The
      store and mill are open 8 am to 6 pm every day.
    where: Cold Hollow Cider Mill, 3600 Waterbury-Stowe Rd, Waterbury Center
    price:
    url: https://www.coldhollow.com/
    tour_query:
  free:
  - 'Spruce Peak Village rink: an outdoor rink that is free to use, with skate rentals
    at Stowe Mountain Resort.'
  - 'Stowe Recreation Path: a 5.3-mile path open all year and popular for snowshoeing.'
  - 'Stowe Winter Carnival ice carving: watch carvers make sculptures in the village
    each January.'
  - 'Stowe Village: walk Main Street and stop at the Go Stowe visitor center at 51
