sacramento-to-lake-tahoe:
  origin: sacramento
  destination: Lake Tahoe
  resorts:
  - palisades-tahoe
  - northstar
  - sugar-bowl
  - heavenly
  - kirkwood
  via: I-80 over Donner Summit, or US-50 over Echo Summit
  main_route: 'North Shore: I-80 east past Auburn and over Donner Summit (about 7,230
    ft), where Sugar Bowl sits, to Truckee, then CA-89 to Palisades Tahoe or CA-267
    to Northstar. South Shore: US-50 east through Folsom and Placerville, over Echo
    Summit (7,382 ft) and down to South Lake Tahoe. Kirkwood is on CA-88, which crosses
    the Sierra at Carson Pass (8,573 ft), about 33 miles south of South Lake Tahoe.'
  winter_driving:
  - 'California chain controls: R-1 means chains unless you have snow tires on at
    least two drive wheels; R-2 means chains unless you have 4WD/AWD with snow tires
    on all four; R-3 means chains on every vehicle. 4WD and AWD drivers still have
    to carry chains.'
  - Caltrans sets up chain checkpoints on both I-80 and US-50 during and after storms.
    US-50 east of Placerville is a two-lane canyon road that has closed for mudslides
    and storm damage.
  - Keep to 25 to 30 mph with chains on. Check Caltrans QuickMap or call 800-427-7623
    before you go.
  - Caltrans tries to keep CA-88 open all winter, but the Carson Spur section is avalanche-prone
    and sometimes closes for avalanche control.
  options:
  - name: El Dorado Transit Sacramento to South Lake Tahoe
    kind: bus
    note: 'One bus each way daily: leaves Sacramento''s Amtrak station at 10:45 am
      and reaches Stateline Transit Center at 1:35 pm, as posted, stopping at Cameron
      Park, Placerville and the South Lake Tahoe Wye. Buy tickets through Amtrak.'
    url: https://eldoradotransit.com/sacramento-south-lake-tahoe-connecting-bus/
  - name: Amtrak California Zephyr
    kind: train
    note: Daily train from Sacramento Valley Station over the Sierra to Truckee.
    url: https://www.amtrak.com/california-zephyr-train
  - name: TART regional buses (from Truckee)
    kind: bus
    note: Free buses from Truckee. The Highway 89 route runs to Olympic Valley and
      Tahoe City; the Highway 267 route stops near Northstar Village. The 2026-27
      winter timetable isn't posted yet.
    url: https://tahoetruckeetransit.com/
  fly_closer: []
  tip: The El Dorado Transit bus ties in with Capitol Corridor trains at Sacramento,
    so you can reach South Lake Tahoe from the Bay Area without a car.
