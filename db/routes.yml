  - steamboat
  via: I-70, CO-9 and US-40
  main_route: I-70 west through the Eisenhower-Johnson Tunnel to exit 205 at Silverthorne,
    CO-9 north to Kremmling, then US-40 west over Muddy Pass and Rabbit Ears Pass
    into Steamboat Springs.
  winter_driving:
  - 'Colorado''s Traction Law is enforced on I-70 between Morrison and Dotsero from
    September 1 to May 31: tires need at least 3/16 inch of tread and must be all-weather
    or winter tires (M+S or mountain-snowflake), or you must carry chains or an approved
    traction device. AWD or 4WD is recommended.'
  - CDOT can call the Traction or Chain Law on any state highway during storms, so
    it can apply on CO-9 and US-40 over Rabbit Ears Pass too.
  options:
  - name: Bustang Outrider (Craig to Denver)
    kind: bus
    note: Daily coach on US-40 with stops including Steamboat Springs, Kremmling,
