salt-lake-city-to-park-city:
  origin: salt-lake-city
  destination: Park City
  resorts:
  - park-city
  via: I-80 through Parleys Canyon
  main_route: I-80 east up Parleys Canyon and over Parleys Summit to Kimball Junction, then SR-224 into Park City (SR-248 from Quinns Junction is the other way in).
  winter_driving:
  - UDOT puts the traction law in place on I-80 through Parleys Canyon during storms, and has also applied it on SR-224 up toward Empire Pass.
  - Crashes on icy mornings can back up eastbound I-80 toward Park City for miles, so check UDOT's road info before you go.
  options:
  - name: High Valley Transit Route 107 (PC-SLC Connect)
    kind: bus
    note: Bus from Salt Lake Central Station to Kimball Junction Transit Center, where Park City's free buses connect.
    url: https://hvtutah.gov/
  - name: Airport shuttles
    kind: shuttle
    note: Canyon Transportation (counter on the airport's ground level) and Salt Lake Express run shared and private rides from SLC to Park City.
    url: https://slcairport.com/parking-transportation/ground-transportation/
  tip: Visit Park City puts the airport about 35 minutes away, one of the shortest airport-to-resort trips in North America.
