san-francisco-to-lake-tahoe:
  origin: san-francisco
  destination: Lake Tahoe
  resorts:
  - palisades-tahoe
  - northstar
  - sugar-bowl
  - heavenly
  - kirkwood
  via: I-80 over Donner Summit, or US-50 over Echo Summit
  main_route: 'North Shore: I-80 east across the Bay Bridge, past Sacramento and Auburn
    and over Donner Summit (about 7,230 ft), where Sugar Bowl sits, to Truckee. From
    Truckee, CA-89 runs to Palisades Tahoe in Olympic Valley and CA-267 to Northstar.
    South Shore: I-80 to Sacramento, then US-50 east through Placerville and over
    Echo Summit (7,382 ft) to South Lake Tahoe. Kirkwood is off CA-88, about 33 miles
    south of South Lake Tahoe.'
  winter_driving:
  - 'California chain controls: R-1 means chains unless you have snow tires on at
    least two drive wheels; R-2 means chains unless you have 4WD/AWD with snow tires
    on all four; R-3 means chains on every vehicle. 4WD and AWD drivers still have
    to carry chains.'
  - Caltrans sets up chain checkpoints on both I-80 and US-50 during and after storms.
    I-80 over Donner Summit can close temporarily in the worst storms.
  - Keep to 25 to 30 mph with chains on. Check Caltrans QuickMap or call 800-427-7623
    before you go.
  - Caltrans tries to keep CA-88 to Kirkwood open all winter, but the Carson Spur
    section is avalanche-prone and sometimes closes for avalanche control.
  options:
  - name: Amtrak California Zephyr
