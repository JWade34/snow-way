salt-lake-city-to-park-city:
  origin: salt-lake-city
  destination: Park City
  resorts:
  - park-city
  via: I-80 through Parleys Canyon
  main_route: I-80 east up Parleys Canyon and over Parleys Summit to Kimball Junction,
    then SR-224 into Park City (SR-248 from Quinns Junction is the other way in).
  winter_driving:
  - UDOT puts the traction law in place on I-80 through Parleys Canyon during storms,
    and has also applied it on SR-224 up toward Empire Pass.
