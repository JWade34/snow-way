denver-to-aspen:
  origin: denver
  destination: Aspen
  resorts:
  - aspen-snowmass
  via: I-70 to Glenwood Springs, then CO-82
  main_route: I-70 west through the Eisenhower-Johnson Tunnel, over Vail Pass and through Glenwood Canyon to exit 116 at Glenwood Springs, then CO-82 up the valley to Aspen.
  winter_driving:
  - CO-82 over Independence Pass (the summer shortcut from Twin Lakes) is closed for the winter and usually reopens around Memorial Day. CDOT says to take I-70 to Glenwood Springs, then CO-82.
  - 'Colorado''s Traction Law is enforced on I-70 between Morrison and Dotsero from September 1 to May 31: tires need at least 3/16 inch of tread and must be all-weather or winter tires (M+S or mountain-snowflake), or you must carry chains or an approved traction device. AWD or 4WD is recommended.'
  - CDOT says I-70 is busiest on holidays, school breaks and January and February weekends. Westbound peaks Friday 2 to 7 pm; eastbound peaks Sunday 3 to 6 pm, building from late morning.
  options:
  - name: Bustang plus RFTA VelociRFTA
    kind: bus
    note: Take Bustang's West Line from Denver Union Station to Glenwood Springs, then RFTA's VelociRFTA bus rapid transit up the valley to Aspen (about an hour, every 12 minutes or less at peak).
    url: https://www.rfta.com/routes/velocirfta-brt/
  fly_closer:
  - airport: Aspen/Pitkin County (ASE)
    note: United, American and Delta fly nonstop. It's open all of the 2026-27 winter, then closes for a runway rebuild from April 4 to November 19, 2027.
  tip: Don't let your GPS send you over Independence Pass in winter; it's gated closed.
  sources:
  - title: 'CDOT: CO 82 Independence Pass closes for winter'
    url: https://www.codot.gov/news/2026/october-2026-news/co82-independencepass-close-for-winter
