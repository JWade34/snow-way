burlington-to-stowe:
  origin: burlington
  destination: Stowe
  resorts:
  - stowe
  via: I-89 and VT-100
  main_route: I-89 southeast to exit 10 at Waterbury, then VT-100 north about 10 miles
    to Stowe village, where VT-108 (the Mountain Road) climbs to the resort.
  winter_driving:
  - VT-108 through Smugglers' Notch, above the resort, is too steep and winding to
    plow and is closed from about late October to May. Come in from Waterbury on VT-100.
  - 'VTrans follows a "safe roads at safe speeds" policy: expect snow on the road
    during a storm, since roads aren''t bare until it ends. Interstates are cleared
    before rural highways.'
  - Plow routes can take 1.5 to 2 hours to loop, so slow down and check newengland511.org.
  options:
  - name: GMT LINK Express plus RCT Route 100 Commuter
    kind: bus
    note: Green Mountain Transit's LINK bus runs from Burlington to the Waterbury
      Park and Ride, where Rural Community Transportation's weekday Route 100 Commuter
      continues to Stowe. Both are commuter-timed.
    url: https://www.riderct.org/route/route-100-commuter/
  - name: Mountain Road Shuttle
    kind: shuttle
    note: Free shuttle looping through Stowe village and up the Mountain Road to the
      resort and Spruce Peak, November 27, 2026 to April 4, 2027.
    url: https://gostowe.com/mountain-road-shuttle/
  fly_closer: []
  tip: Park in the village and ride the free Mountain Road Shuttle up to the resort.
    Text RCTAlerts to 64800 for delay alerts.
