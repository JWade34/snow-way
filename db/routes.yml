salt-lake-city-to-alta-snowbird:
  origin: salt-lake-city
  destination: Alta and Snowbird
  resorts:
  - snowbird
  - alta
  via: Little Cottonwood Canyon (SR-210)
  main_route: Across the valley to the mouth of Little Cottonwood Canyon, then SR-210, a 13-mile canyon road that passes Snowbird and dead-ends at Alta.
  winter_driving:
  - 'When the canyon''s beacons flash, UDOT''s traction law applies: at least 5/32 inch of tread, M+S tires on all four wheels for AWD/4WD, and 3-peak snowflake tires or chains on the drive wheels for 2WD. Police check cars at the canyon mouth and turn around ones that don''t comply.'
  - Alta says state law requires snow tires or carried chains from November 1 to May 1.
  - UDOT closes the road for avalanche control, often overnight and sometimes during the day. Resorts can order an "interlodge," when everyone has to stay indoors until it's safe.
  options:
  - name: UTA ski buses (994 and canyon service)
    kind: bus
    note: Ski buses to Snowbird and Alta, planned from December 6 to April 11. $5 one way, as listed, and free with a resort season pass or a 2026-27 Ikon Pass.
    url: https://www.rideuta.com/Rider-Info/Ski-Service
  - name: Airport shuttles
    kind: shuttle
    note: Canyon Transportation and Alta Shuttle run rides from SLC; their counters are on the terminal's ground level.
    url: https://slcairport.com/parking-transportation/ground-transportation/
  tip: 'Alta requires parking reservations Friday to Sunday and holidays from 8 am to 1 pm (December 11 to April 4): $25 a day, or $10 with an online lift ticket, as listed. Take the bus and skip it.'
  sources:
  - title: 'UDOT Cottonwood Canyons: Traction law'
    url: https://cottonwoodcanyons.udot.utah.gov/traction-law/
  - title: 'UDOT Cottonwood Canyons: Avalanche information'
    url: https://cottonwoodcanyons.udot.utah.gov/avalanche-information/
