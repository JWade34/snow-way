denver-to-crested-butte:
  origin: denver
  destination: Crested Butte
  resorts:
  - crested-butte
  via: US-285, US-50 over Monarch Pass, then CO-135
  main_route: US-285 southwest through Fairplay and Buena Vista, then US-50 west through
    Salida and over Monarch Pass (11,312 ft) on the Continental Divide to Gunnison,
    then CO-135 north 27.5 miles through Almont to Crested Butte, the only paved road
    into town.
  winter_driving:
  - Monarch Pass has grades up to 7%, long 6% descents of about 10 miles on the east
    side and 9 on the west, heavy winter snow and occasional storm closures.
  - CDOT can call the Traction or Chain Law on any state highway during storms, including
    US-285, US-50 and CO-135. Check COtrip.org for active restrictions.
  options:
  - name: Bustang Outrider (Crested Butte to Denver)
    kind: bus
    note: Daily, year-round coach between Denver Union Station and Crested Butte,
      stopping in Pine Junction, Fairplay, Buena Vista, Salida, Monarch Mountain (December
      to April), Gunnison and Almont.
    url: https://ridebustang.com/routes
  - name: Gunnison Valley RTA
    kind: bus
    note: Free bus along the Highway 135 corridor between Gunnison, Crested Butte
      and Mt. Crested Butte. It doesn't stop at the airport.
    url: https://www.gunnisonvalleyrta.com/
  fly_closer:
  - airport: Gunnison-Crested Butte Regional (GUC)
    note: One mile southwest of Gunnison. United Express flies year-round from Denver,
      with seasonal United flights from Chicago and Houston and American from Dallas.
      Last winter Denver had three flights a day.
  tip: Flying into Gunnison skips Monarch Pass. From there the free RTA bus or a short
    drive up CO-135 gets you to Crested Butte.
