  resorts:
  - killington
  via: I-87, NY-149 and US-4
  main_route: 'One route: I-87 north past Albany to exit 20 at Queensbury, NY-149
    east to US-4 at Fort Ann, then US-4 north into Vermont. US-4 becomes a four-lane
    expressway through Castleton and West Rutland, runs through Rutland, then climbs
    east as a two-lane road into Killington.'
  winter_driving:
  - East of Rutland, US-4 is a two-lane highway winding through the Green Mountains.
  - 'VTrans follows a "safe roads at safe speeds" policy: expect snow on the road
    during a storm, since roads aren''t bare until it ends. Interstates are cleared
    before rural highways.'
  - Plow routes can take 1.5 to 2 hours to loop, so slow down and check newengland511.org.
  options:
  - name: Amtrak Ethan Allen Express
    kind: train
    note: Daily train from New York Moynihan Train Hall through Albany to Rutland,
      then on to Burlington.
    url: https://www.amtrak.com/ethan-allen-express-train
  - name: The Bus (Rutland to Killington)
    kind: bus
    note: Marble Valley Regional Transit runs hourly from Rutland up US-4 to the resort,
      seven days a week. Check that its last run lines up with your train.
    url: https://thebus.com/routes/rutland-killington-commuter/
  - name: OvR ski bus
    kind: bus
    note: Killington lists round-trip day buses from Brooklyn and Manhattan on select
      Saturdays. The 2026-27 trip calendar isn't posted yet.
    url: https://ovrride.com/calendar/
  fly_closer:
  - airport: Burlington International (BTV)
    note: Nonstops from New York JFK and LaGuardia. Vermont Translines runs daily
      buses from Burlington to Rutland, connecting to The Bus.
  - airport: Rutland-Southern Vermont Regional (RUT)
    note: The closest airport to Killington. Cape Air flies there three times a day
      from Boston and also lists Islip, Long Island.
  tip: Taking the Ethan Allen Express to Rutland and The Bus up to the resort skips
    the drive entirely.
  sources:
  - title: 'Wikipedia: New York State Route 149'
    url: https://en.wikipedia.org/wiki/New_York_State_Route_149
  - title: 'Wikipedia: U.S. Route 4 in Vermont'
    url: https://en.wikipedia.org/wiki/U.S._Route_4_in_Vermont
  - title: 'VTrans: Snow and ice control FAQ'
    url: https://vtrans.vermont.gov/operations/winter-maintenance/faq
  - title: Amtrak Ethan Allen Express
    url: https://www.amtrak.com/ethan-allen-express-train
  - title: 'The Bus: Rutland-Killington Commuter'
    url: https://thebus.com/routes/rutland-killington-commuter/
  - title: 'Killington: Transportation, parking and shuttles'
    url: https://killington.com/transportation-parking-and-shuttles
  - title: OvR
    url: https://ovrride.com/
  - title: 'Go Stowe: Traveling to Stowe by air (BTV routes)'
    url: https://gostowe.com/traveling-to-stowe-by-air
  - title: 'Cape Air: Flights to Rutland'
    url: https://flights.capeair.com/en/flights-to-rutland
los-angeles-to-mammoth:
  origin: los-angeles
  destination: Mammoth Lakes
  resorts:
  - mammoth-mountain
  via: CA-14 and US-395
  main_route: I-5 north to CA-14, the Antelope Valley Freeway, through Palmdale, Lancaster
    and Mojave to US-395 near Inyokern. Then US-395 north through Lone Pine, Independence
    and Bishop, up the Sherwin Grade past Crowley Lake, and west on CA-203 into Mammoth
    Lakes.
  winter_driving:
  - 'California chain controls: R-1 means chains unless you have snow tires on at
    least two drive wheels; R-2 means chains unless you have 4WD/AWD with snow tires
    on all four; R-3 means chains on every vehicle. 4WD and AWD drivers still have
    to carry chains.'
  - Visit Mammoth warns that trips from November through April can mean snowstorms,
    chain controls and fast-changing roads.
  - The trans-Sierra passes close for winter, including Tioga Pass (CA-120 W at Lee
    Vining) and Sonora Pass (CA-108). CA-203 past Mammoth Mountain toward Devils Postpile
    also closes.
  options:
  - name: Eastern Sierra Transit 395 Lancaster
    kind: bus
    note: Daily bus between Lancaster's Metrolink station and Mammoth Lakes, stopping
      in Mojave, Inyokern, Lone Pine and Bishop. Northbound leaves Lancaster at 2:00
      pm and reaches Mammoth at 7:00 pm; $39 one way, as listed.
    url: https://www.estransit.com/
  - name: Eastern Sierra Transit Airport Flyer
    kind: shuttle
    note: "$10 a seat from Bishop (BIH) or Mammoth Yosemite (MMH) airport to Mammoth
      Lakes, timed to flights. Reserve ahead."
    url: https://www.estransit.com/routes-schedule
  fly_closer:
  - airport: Mammoth Yosemite (MMH)
    note: Advanced Air, a public charter, flies from Hawthorne (HHR) in LA and Carlsbad
      four days a week (Thursday, Friday, Sunday, Monday), November 25, 2026 to April
      26, 2027.
  - airport: Eastern Sierra Regional, Bishop (BIH)
    note: United flies from San Francisco and Denver, daily from December 17, 2026
      to March 27, 2027.
  tip: The Lancaster bus meets Metrolink, so you can get from LA to Mammoth by train
    and bus without a car.
  sources:
  - title: 'Caltrans: Chain controls'
    url: https://dot.ca.gov/travel/winter-driving-tips/chain-controls
  - title: 'Caltrans District 9: SR 120 W reopens, 2026'
    url: https://dot.ca.gov/caltrans-near-me/district-9/district-9-news/2026_4_15-120-w-reopens
  - title: 'Caltrans District 9: SR 120 W closes for winter, 2024'
    url: https://dot.ca.gov/caltrans-near-me/district-9/district-9-news/2024_11_25-sr-120-w-closes
  - title: 'Wikipedia: California State Route 14'
    url: https://en.wikipedia.org/wiki/California_State_Route_14
  - title: 'Wikipedia: U.S. Route 395 in California'
    url: https://en.wikipedia.org/wiki/U.S._Route_395_in_California
  - title: 'Visit Mammoth: Driving'
    url: https://www.visitmammoth.com/travel-info/driving/
  - title: 'Visit Mammoth: Flying'
    url: https://www.visitmammoth.com/travel-info/flying/
  - title: 'Town of Mammoth Lakes: Airlines'
    url: https://townofmammothlakes.ca.gov/107/Airlines
  - title: 'Eastern Sierra Transit: 395 Lancaster brochure'
    url: https://www.estransit.com/hwy-395-lancaster-route
  - title: 'Eastern Sierra Transit: Routes and schedules'
    url: https://www.estransit.com/routes-schedule
salt-lake-city-to-deer-valley:
  origin: salt-lake-city
  destination: Deer Valley
  resorts:
  - deer-valley
  via: I-80 through Parleys Canyon, then SR-224, SR-248 or US-40
  main_route: I-80 east up Parleys Canyon and over Parleys Summit, then either SR-224
    from Kimball Junction or US-40 to SR-248 (Kearns Boulevard) into Park City for
    the Snow Park base. Deer Valley's East Village base is off US-40 at the Mayflower
    exit.
  winter_driving:
  - UDOT puts the traction law in place on I-80 through Parleys Canyon during storms,
    and has also applied it on SR-224 up toward Empire Pass.
  - Crashes on icy mornings can back up eastbound I-80 toward Park City for miles,
    so check UDOT's road info before you go.
  options:
  - name: High Valley Transit Route 107 plus Park City Transit
    kind: bus
    note: High Valley Transit runs from Salt Lake Central Station to Kimball Junction.
      Park City Transit's free buses then reach Deer Valley's Snow Park Lodge, mostly
      via the Old Town Transit Center.
    url: https://hvtutah.gov/
  - name: Airport shuttles
    kind: shuttle
    note: Canyon Transportation (counter on the airport's ground level) and Salt Lake
      Express run shared and private rides from SLC to Park City.
    url: https://slcairport.com/parking-transportation/ground-transportation/
  fly_closer: []
  tip: If Snow Park's lots fill, UDOT says the Richardson Flat Park and Ride has overflow
    parking with free buses to Snow Park Lodge about every 15 minutes.
  sources:
  - title: 'UDOT Wasatch Back: Traction law'
    url: https://wasatchback.udot.utah.gov/traction-law/
  - title: 'UDOT Wasatch Back: Recreation (Deer Valley parking)'
    url: https://wasatchback.udot.utah.gov/recreation/
  - title: 'TownLift: UDOT storm advisory, Feb 2026'
    url: https://townlift.com/2026/02/udot-encourages-drivers-to-limit-travel-on-wasatch-back-roads-during-snow-storm/
  - title: 'TownLift: I-80 delays, Jan 2026'
    url: https://townlift.com/2026/01/i-80-delays-stretch-for-miles-after-icy-morning-in-parleys-canyon/
  - title: 'Wikipedia: Utah State Route 248'
    url: https://en.wikipedia.org/wiki/Utah_State_Route_248
  - title: 'Wikipedia: Park City Transit'
    url: https://en.wikipedia.org/wiki/Park_City_Transit
  - title: High Valley Transit
    url: https://hvtutah.gov/
  - title: 'SLC Airport: Ground transportation'
    url: https://slcairport.com/parking-transportation/ground-transportation/
  - title: 'Visit Park City: Getting to Park City'
