salt-lake-city-to-alta-snowbird:
  origin: salt-lake-city
  destination: Alta and Snowbird
  resorts:
  - snowbird
  - alta
  via: Little Cottonwood Canyon (SR-210)
  main_route: Across the valley to the mouth of Little Cottonwood Canyon, then SR-210,
    a 13-mile canyon road that passes Snowbird and dead-ends at Alta.
  winter_driving:
  - 'When the canyon''s beacons flash, UDOT''s traction law applies: at least 5/32
    inch of tread, M+S tires on all four wheels for AWD/4WD, and 3-peak snowflake
    tires or chains on the drive wheels for 2WD. Police check cars at the canyon mouth
    and turn around ones that don''t comply.'
  - Alta says state law requires snow tires or carried chains from November 1 to May
    1.
  - UDOT closes the road for avalanche control, often overnight and sometimes during
    the day. Resorts can order an "interlodge," when everyone has to stay indoors
    until it's safe.
  options:
  - name: UTA ski buses (994 and canyon service)
    kind: bus
    note: Ski buses to Snowbird and Alta, planned from December 6 to April 11. $5
      one way, as listed, and free with a resort season pass or a 2026-27 Ikon Pass.
    url: https://www.rideuta.com/Rider-Info/Ski-Service
  - name: Airport shuttles
    kind: shuttle
    note: Canyon Transportation and Alta Shuttle run rides from SLC; their counters
      are on the terminal's ground level.
    url: https://slcairport.com/parking-transportation/ground-transportation/
  tip: 'Alta requires parking reservations Friday to Sunday and holidays from 8 am
    to 1 pm (December 11 to April 4): $25 a day, or $10 with an online lift ticket,
    as listed. Take the bus and skip it.'
  sources:
  - title: 'UDOT Cottonwood Canyons: Traction law'
    url: https://cottonwoodcanyons.udot.utah.gov/traction-law/
  - title: 'UDOT Cottonwood Canyons: Avalanche information'
    url: https://cottonwoodcanyons.udot.utah.gov/avalanche-information/
  - title: 'Alta: Winter driving tips'
    url: https://www.alta.com/getting-here/winter-driving-tips
  - title: 'Alta: Driving to Alta'
    url: https://www.alta.com/getting-here/driving-to-alta
  - title: 'Alta: Parking'
    url: https://www.alta.com/getting-here/parking-info
  - title: UTA Ski Service
    url: https://www.rideuta.com/Rider-Info/Ski-Service
reno-to-lake-tahoe:
  origin: reno
  destination: Lake Tahoe
  resorts:
  - northstar
  - palisades-tahoe
  - heavenly
  via: I-80 to the North Shore, or US-50 to South Lake Tahoe
  main_route: 'North Shore: I-80 west to Truckee, then CA-89 south to Palisades Tahoe;
    the Mt. Rose Highway (NV-431) is the direct route to Incline Village. South Shore:
    I-580 south to Carson City, then US-50 west over Spooner Summit to Stateline and
    South Lake Tahoe (Kingsbury Grade, NV-207, is the alternate).'
  winter_driving:
  - 'California chain controls: R-1 means chains unless you have snow tires on at
    least two drive wheels; R-2 means chains unless you have 4WD/AWD with snow tires
    on all four; R-3 means chains on every vehicle. 4WD and AWD drivers still have
    to carry chains.'
  - Caltrans says to chain up only where signs say so and keep to 25 to 30 mph with
    chains on. Check Caltrans QuickMap or call 800-427-7623.
  - Nevada requires chains, or 4WD/AWD with snow tires, during chain controls on US-50,
    the Mt. Rose Highway and Kingsbury Grade.
  options:
  - name: North Lake Tahoe Express
    kind: shuttle
    note: Year-round shuttle from Reno-Tahoe airport to North Lake Tahoe and Truckee.
      Reserve ahead.
    url: http://northlaketahoeexpress.com/
  - name: South Tahoe Airporter
    kind: shuttle
    note: From the airport (outside Door D) to the Stateline casinos and South Lake
      Tahoe. $32.75 one way or $59.50 round trip for adults, as listed.
    url: https://www.southtahoeairporter.com/
  tip: Chain controls change by the hour and differ between California and Nevada.
    Check Caltrans QuickMap and NVRoads right before you leave.
  sources:
  - title: 'Caltrans: Chain controls'
    url: https://dot.ca.gov/travel/winter-driving-tips/chain-controls
  - title: 'Caltrans: Winter driving tips'
    url: https://dot.ca.gov/travel/winter-driving-tips
  - title: 'NNBW: NDOT chain requirements'
    url: https://nnbw.com/news/2018/nov/30/ndot-to-enforce-stiffer-chain-requirements-on-taho
  - title: 'Palisades Tahoe: Navigating North Lake Tahoe'
    url: https://www.palisadestahoe.com/plan-your-visit/travel-here/navigate-nlt-guide
  - title: 'Visit Lake Tahoe: Getting here'
    url: https://visitlaketahoe.com/getting-here/
  - title: North Lake Tahoe Express
    url: http://northlaketahoeexpress.com/
  - title: South Tahoe Airporter
    url: https://www.southtahoeairporter.com/
