vancouver-to-whistler:
  origin: vancouver
  destination: Whistler
  resorts:
  - whistler-blackcomb
  via: Highway 99, the Sea to Sky Highway
  main_route: Highway 99 across the Lions Gate Bridge into West Vancouver, the Upper
    Levels Highway (Highway 1) to Horseshoe Bay, then the Sea to Sky Highway north
    along Howe Sound through Squamish and up the Cheakamus Canyon to Whistler. About
    110 km from the bridge.
  winter_driving:
  - Highway 99 from Horseshoe Bay through Whistler to Pemberton is a designated winter
    tire and chain route. BC requires winter tires or chains on designated routes
    from October 1; most routes run to April 30, and some lower routes end March 31.
  - A legal BC winter tire has at least 3.5 mm of tread and either the M+S mark or
    the 3-peaked mountain/snowflake symbol. Chains on summer tires don't count.
  - 'Whistler RCMP warn conditions change fast on the drive: rain and hydroplaning
    down low, heavy snow and ice higher up.'
  options:
  - name: YVR Skylynx
    kind: bus
    note: The airport's official Whistler bus, with up to 14 departures a day. Staff
      meet you by the international arrivals escalators. Standard runs stop downtown
      and in Squamish; express runs go straight from YVR.
    url: https://yvrskylynx.com/
  - name: Epic Rides
    kind: bus
    note: Year-round nonstop bus from Burrard Station (1088 Melville St) to Whistler's
      Gateway Loop, about 1 hour 45 minutes. $33.50 one way or $44 round trip, as
      listed; skis and boards ride free.
    url: https://epicrides.ca/
  fly_closer: []
  tip: Check DriveBC for conditions, delays and closures before you head up the Sea
    to Sky.
  sources:
  - title: 'BC Government: Designated winter tire and chain routes'
    url: https://www2.gov.bc.ca/gov/content/transportation/driving-and-cycling/traveller-information/seasonal/winter-driving/winter-tire-and-chain-up-routes
  - title: 'BC Government: About winter tires'
