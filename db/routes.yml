      Wooly Mammoth park-and-ride straight to Copper. Last season Copper service started
      December 20, at $25 round trip ($12.50 kids), as listed; 2026-27 dates aren't
      posted yet.
    url: https://www.ridebustang.com/
  - name: Bustang West Line or Pegasus, then Summit Stage
    kind: bus
