# "Getting there" pages. Every fact is sourced (see sources). Drive times come from db/route_drives.yml. Researched 2026-11-08.
---
denver-to-breckenridge:
  origin: denver
  destination: Breckenridge
  resorts:
  - breckenridge
  via: I-70 and CO-9
  main_route: I-70 west through the Eisenhower-Johnson Memorial Tunnel (the Continental
    Divide, up to 11,158 ft), exit 203 at Frisco, then CO-9 south into Breckenridge.
  winter_driving:
  - 'Colorado''s Traction Law is enforced on I-70 between Morrison and Dotsero from
    September 1 to May 31: tires need at least 3/16 inch of tread and must be all-weather
    or winter tires (M+S or mountain-snowflake), or you must carry chains or an approved
    traction device. AWD or 4WD is recommended.'
  - 'In bad storms CDOT can call the Passenger Vehicle Chain Law, the last step before
    a closure: every vehicle needs chains or an approved device.'
  - Fines start at $100 plus a $33 surcharge, and $500 plus $157 if your car blocks
    a lane.
  - CDOT says I-70 is busiest on holidays, school breaks and January and February
    weekends. Westbound peaks Friday 2 to 7 pm; eastbound peaks Sunday 3 to 6 pm,
    building from late morning.
  options:
  - name: Snowstang ski bus (CDOT)
    kind: bus
    note: Weekend and holiday ski bus from Denver Union Station, Federal Center and
      Wooly Mammoth park-and-ride to Breckenridge, A-Basin, Copper and Loveland. Last
      season it ran December to early May for $25 round trip ($12.50 kids), as listed;
      2026-27 dates aren't posted yet.
    url: https://www.ridebustang.com/
  - name: Bustang West Line and Pegasus (CDOT)
    kind: bus
    note: Daily coach and express van along I-70 from Union Station, stopping in Frisco,
      where the free Summit Stage bus connects to Breckenridge.
    url: https://www.ridebustang.com/
  - name: Summit Express
    kind: shuttle
    note: Shared and private shuttles from Denver International Airport to Summit
      County and the Vail Valley.
    url: https://www.summitexpress.com/
  tip: 'CDOT''s advice for beating I-70 traffic: go midweek or early, stay through
    Sunday night, or take Snowstang or Pegasus.'
  sources:
  - title: 'CDOT: Traction Law'
    url: https://www.codot.gov/travel/winter-driving/tractionlaw
  - title: 'CDOT: How to avoid I-70 ski traffic'
    url: https://www.codot.gov/programs/dmo/how-to-avoid-i-70-ski-traffic-like-a-pro
  - title: 'CDOT: Snowstang 2025-26'
    url: https://www.codot.gov/news/2025/december/snowstang-services-2025-2026
  - title: 'Wikipedia: Interstate 70 in Colorado'
    url: https://en.wikipedia.org/wiki/Interstate_70_in_Colorado
  - title: 'Wikipedia: Colorado State Highway 9'
    url: https://en.wikipedia.org/wiki/Colorado_State_Highway_9
  - title: Summit Express
    url: https://www.summitexpress.com/
