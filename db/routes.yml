    Mountain.
  winter_driving:
  - 'Colorado''s Traction Law is enforced on I-70 between Morrison and Dotsero from
    September 1 to May 31: tires need at least 3/16 inch of tread and must be all-weather
    or winter tires (M+S or mountain-snowflake), or you must carry chains or an approved
    traction device. AWD or 4WD is recommended.'
  - 'In bad storms CDOT can call the Passenger Vehicle Chain Law, the last step before
    a closure: every vehicle needs chains or an approved device.'
  - CDOT says I-70 is busiest on holidays, school breaks and January and February
    weekends. Westbound peaks Friday 2 to 7 pm; eastbound peaks Sunday 3 to 6 pm,
    building from late morning.
