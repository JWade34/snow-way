reno-to-lake-tahoe:
  origin: reno
  destination: Lake Tahoe
  resorts:
  - northstar
  - palisades-tahoe
  - heavenly
  via: I-80 to the North Shore, or US-50 to South Lake Tahoe
  main_route: 'North Shore: I-80 west to Truckee, then CA-89 south to Palisades Tahoe; the Mt. Rose Highway (NV-431) is the direct route to Incline Village. South Shore: I-580 south to Carson City, then US-50 west over Spooner Summit to Stateline and South Lake Tahoe (Kingsbury Grade, NV-207, is the alternate).'
  winter_driving:
  - 'California chain controls: R-1 means chains unless you have snow tires on at least two drive wheels; R-2 means chains unless you have 4WD/AWD with snow tires on all four; R-3 means chains on every vehicle. 4WD and AWD drivers still have to carry chains.'
  - Caltrans says to chain up only where signs say so and keep to 25 to 30 mph with chains on. Check Caltrans QuickMap or call 800-427-7623.
  - Nevada requires chains, or 4WD/AWD with snow tires, during chain controls on US-50, the Mt. Rose Highway and Kingsbury Grade.
  options:
  - name: North Lake Tahoe Express
    kind: shuttle
    note: Year-round shuttle from Reno-Tahoe airport to North Lake Tahoe and Truckee. Reserve ahead.
    url: http://northlaketahoeexpress.com/
  - name: South Tahoe Airporter
    kind: shuttle
    note: From the airport (outside Door D) to the Stateline casinos and South Lake Tahoe. $32.75 one way or $59.50 round trip for adults, as listed.
    url: https://www.southtahoeairporter.com/
  tip: Chain controls change by the hour and differ between California and Nevada. Check Caltrans QuickMap and NVRoads right before you leave.
  sources:
  - title: 'Caltrans: Chain controls'
    url: https://dot.ca.gov/travel/winter-driving-tips/chain-controls
  - title: 'Caltrans: Winter driving tips'
    url: https://dot.ca.gov/travel/winter-driving-tips
  - title: 'NNBW: NDOT chain requirements'
    url: https://nnbw.com/news/2018/nov/30/ndot-to-enforce-stiffer-chain-requirements-on-taho
  - title: 'Palisades Tahoe: Navigating North Lake Tahoe'
    url: https://www.palisadestahoe.com/plan-your-visit/travel-here/navigate-nlt-guide
  - title: 'Visit Lake Tahoe: Getting here'
    url: https://visitlaketahoe.com/getting-here/
  - title: North Lake Tahoe Express
    url: http://northlaketahoeexpress.com/
  - title: South Tahoe Airporter
    url: https://www.southtahoeairporter.com/
bozeman-to-big-sky:
  origin: bozeman
  destination: Big Sky
  resorts:
  - big-sky
  via: US-191 through Gallatin Canyon
  main_route: From Bozeman Yellowstone airport (in Belgrade) south on US-191 through Gallatin Canyon, then MT-64 west up to Big Sky Mountain Village. About 50 miles.
  winter_driving:
  - Montana DOT plows the stretch from Four Corners to the canyon mouth around the clock in storms; inside Gallatin Canyon coverage is roughly 5 am to 10 pm, and cell service is spotty.
  - Crashes have closed the canyon for hours. Big Sky Resort recommends proper winter tires.
  options:
  - name: Skyline Link
    kind: bus
    note: Bus from Bozeman (several stops, including Four Corners park-and-ride) to Big Sky, 11 trips up and 12 down daily from November 23, 2026 to April 11, 2027. $5 each way, as listed. It doesn't serve the airport.
    url: https://www.skylinebus.com/routes/winter
  - name: Karst Stage
    kind: shuttle
    note: Daily airport shuttle from BZN to Big Sky, about 1 hour 15 minutes.
    url: https://www.karststage.com/airport-shuttle
  - name: Other shuttles
    kind: shuttle
    note: Big Sky Resort also lists Big Sky Shuttle, Peak Shuttle and private car services.
    url: https://www.bigskyresort.com/getting-here/flying/transportation
  tip: 'Book your airport ride ahead: Big Sky Resort says Uber and Lyft aren''t available in Big Sky.'
  sources:
  - title: 'MDT: US-191 public meeting'
    url: https://www.mdt.mt.gov/pubinvolve/us191/docs/US191_PublicMeeting01_Displays.pdf
  - title: 'Explore Big Sky: Highway 191'
    url: https://www.explorebigsky.com/highway-191-montanas-ticking-time-bomb-of-a-road/68094
  - title: 'Big Sky Resort: Airport transportation'
    url: https://www.bigskyresort.com/getting-here/flying/transportation
  - title: Skyline winter schedule
    url: https://www.skylinebus.com/routes/winter
  - title: Karst Stage airport shuttle
