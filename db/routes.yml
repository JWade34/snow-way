denver-to-telluride:
  origin: denver
  destination: Telluride
  resorts:
  - telluride
  via: I-70, US-50, US-550, CO-62 and CO-145
  main_route: I-70 west over the Continental Divide and through Glenwood Canyon toward
    Grand Junction, then south through Delta to Montrose, US-550 to Ridgway, CO-62
    west over the Dallas Divide (8,983 ft) to Placerville, and CO-145 up the San Miguel
    River into Telluride.
  winter_driving:
  - 'Colorado''s Traction Law is enforced on I-70 between Morrison and Dotsero from
    September 1 to May 31: tires need at least 3/16 inch of tread and must be all-weather
    or winter tires (M+S or mountain-snowflake), or you must carry chains or an approved
    traction device. AWD or 4WD is recommended.'
  - CDOT can call the Traction or Chain Law on any state highway during storms, so
    it can apply on US-550, CO-62 and CO-145 too.
  - CDOT says I-70 is busiest on holidays, school breaks and January and February
    weekends. Westbound peaks Friday 2 to 7 pm; eastbound peaks Sunday 3 to 6 pm,
    building from late morning.
  options:
  - name: Bustang to Grand Junction, then Outrider
    kind: bus
    note: Bustang coaches run from Denver Union Station to Grand Junction. From there,
      the Durango to Grand Junction Outrider route serves Placerville and Telluride.
    url: https://ridebustang.com/routes
  - name: Telluride Express
    kind: shuttle
    note: Shared, private and charter transfers from Montrose (MTJ) and Telluride
      (TEX) airports, plus Grand Junction and Durango.
    url: https://letsride.co/locations/telluride/
  fly_closer:
  - airport: Telluride Regional (TEX)
    note: About 10 minutes from town. Denver Air Connection, a United partner, flies
      year-round from Denver.
  - airport: Montrose Regional (MTJ)
    note: 65 miles from Telluride. Last winter it had 15 nonstop flights from 13 hubs
      on six airlines; the 2026-27 list isn't published yet.
  tip: 'Book your ride from the airport ahead: Telluride Tourism says Uber and on-demand
    car services aren''t available at TEX or MTJ.'
