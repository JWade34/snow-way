# Hand-reviewed NOAA weather station for resorts with no SNOTEL station (the East, Midwest, Canada and a few
# western names). Daily snowfall from NWS co-op, CoCoRaHS and Environment Canada observers via NOAA ACIS (data.rcc-acis.org).
# Rules: within 5 miles of the resort, no more than 800 ft below the base, not above the summit + 500 ft,
# and 8+ of the last 10 winters with 80%+ of days reported. Most sit at the base or in the valley, so they read
# lower than the mountain. Resorts not listed get no snow-day number on the site.
# quality: good = within 2 miles and within 500 ft of the base; ok = the rest that pass the rules.
# Reviewed 2026-11-19. Rejected matches (too far, too low or a summit station) are in docs/seo/noaa-station-review.md.
source: "NOAA Applied Climate Information System (ACIS): NWS cooperative, CoCoRaHS and Environment Canada daily snowfall"
